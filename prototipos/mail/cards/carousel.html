<!doctype html>
<html lang="es"
  data-composition-variables='[
    {"id":"p1","type":"string","label":"Foto 1","default":"assets/svc_led.jpg"},
    {"id":"p2","type":"string","label":"Foto 2","default":"assets/svc_led_alt.jpg"},
    {"id":"p3","type":"string","label":"Foto 3","default":"assets/svc_led_alt2.jpg"},
    {"id":"c1","type":"string","label":"Ubicación 1","default":"Chacao · Edificio Valmy"},
    {"id":"c2","type":"string","label":"Ubicación 2","default":"Chacao · de noche"},
    {"id":"c3","type":"string","label":"Ubicación 3","default":"Las Mercedes · Paseo Enrique Eraso"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200, height=800" />
    <title>Centauro ADS — carrusel de servicio</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 800px; overflow: hidden; background: #0F0E13; }
      body { font-family: Montserrat, "Trebuchet MS", Arial, Helvetica, sans-serif; color: #fff; }
      #root { position: relative; width: 1200px; height: 800px; overflow: hidden; background: #0F0E13; }
      .clip { position: absolute; inset: 0; }
      /* Fotos apiladas. Cada foto entrante se revela con un barrido direccional (clip-path inset),
         mecanismo tomado del componente directional-wipe del registro de HyperFrames. */
      .ph { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .ph img { display: block; width: 100%; height: 100%; object-fit: cover; }
      #ph2, #ph3 { clip-path: inset(0 100% 0 0); }
      /* Destello que acompaña al barrido (fx del mismo componente), muy tenue. */
      #fx { position: absolute; inset: 0; display: block; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent 35%, rgba(255,255,255,.55) 50%, transparent 65%);
            mix-blend-mode: screen; transform: translateX(-110%); opacity: 0; }
      /* Sombra inferior para legibilidad de la etiqueta. */
      #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,14,19,0) 60%, rgba(15,14,19,.72) 100%); }
      /* Indicador de progreso tipo "historias": tres segmentos que se llenan en naranja. */
      #prog { position: absolute; top: 28px; left: 36px; right: 36px; display: flex; gap: 8px; }
      #prog .seg { position: relative; flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.35); overflow: hidden; display: block; }
      #prog .seg i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #F79131; display: block; transform-origin: left center; transform: scaleX(0); }
      /* Etiqueta de ubicación: píldora discreta abajo a la izquierda. */
      .cap { position: absolute; left: 36px; bottom: 34px; display: flex; align-items: center; gap: 12px;
             background: rgba(15,14,19,.72); border-radius: 30px; padding: 12px 22px 12px 16px;
             font-size: 26px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
      .cap .pin { width: 12px; height: 12px; border-radius: 6px; background: #F79131; display: block; box-shadow: 0 0 0 4px rgba(247,145,49,.25); }
      #cap2, #cap3 { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.2" data-fps="24" data-width="1200" data-height="800">
      <section id="shot" class="clip" data-start="0" data-duration="9.2" data-track-index="1">
        <div class="ph" id="ph1"><img data-var-src="p1" src="assets/svc_led.jpg" alt="" /></div>
        <div class="ph" id="ph2"><img data-var-src="p2" src="assets/svc_led_alt.jpg" alt="" /></div>
        <div class="ph" id="ph3"><img data-var-src="p3" src="assets/svc_led_alt2.jpg" alt="" /></div>
        <div id="fx"></div>
        <div id="shade"></div>
        <div id="prog"><span class="seg"><i id="s1"></i></span><span class="seg"><i id="s2"></i></span><span class="seg"><i id="s3"></i></span></div>
        <div class="cap" id="cap1"><span class="pin"></span><span data-var-text="c1">Chacao · Edificio Valmy</span></div>
        <div class="cap" id="cap2"><span class="pin"></span><span data-var-text="c2">Chacao · de noche</span></div>
        <div class="cap" id="cap3"><span class="pin"></span><span data-var-text="c3">Las Mercedes · Paseo Enrique Eraso</span></div>
      </section>
    </div>

    <script>
      function build() {
        const tl = gsap.timeline({ paused: true });
        const HOLD = 2.2, WIPE = 1.3; // transición lenta: el ojo sigue el barrido en vez de percibir un salto
        // Foto 1 ya visible en el frame 0 (Outlook) con su segmento lleno. Los holds son 100 % estáticos
        // (el GIF no gasta fotogramas); el progreso avanza junto con cada barrido.
        tl.set("#s1", { scaleX: 1 }, 0);
        const beats = [
          { ph: "#ph2", seg: "#s2", capIn: "#cap2", capOut: "#cap1", at: HOLD },
          { ph: "#ph3", seg: "#s3", capIn: "#cap3", capOut: "#cap2", at: HOLD * 2 + WIPE },
        ];
        beats.forEach(function (b) {
          // Barrido de izquierda a derecha: el inset derecho pasa de 100% a 0.
          tl.fromTo(b.ph, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: WIPE, ease: "sine.inOut" }, b.at);
          // Sin destello: repintaba un tercio del cuadro por fotograma y triplicaba el peso del GIF.
          tl.to(b.capOut, { y: 10, opacity: 0, duration: 0.5, ease: "sine.in" }, b.at);
          tl.fromTo(b.capIn, { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "sine.out" }, b.at + 0.6);
          tl.fromTo(b.seg, { scaleX: 0 }, { scaleX: 1, duration: WIPE, ease: "sine.inOut" }, b.at);
        });
        tl.seek(0);
        window.__timelines["main"] = tl;
        if (window.__hfForceTimelineRebind) window.__hfForceTimelineRebind();
      }
      if (document.fonts && document.fonts.ready) { document.fonts.ready.then(build); } else { build(); }
    </script>
  </body>
</html>
