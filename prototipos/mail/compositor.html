<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0F0E13">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compositor de Mails Centauro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme:dark;
    --bg:#0F0E13; --card:#1A1921; --hover:#232130; --border:#2D2B3A; --line:#3A3748;
    --text:#EEEDF2; --dim:#9895A7; --faint:#87839A;   /* #6A6778 daba 3,5:1 y hace falta 4,5:1 */
    --purple:#85439A; --purple-l:#A667BD;
    /* borde de los campos: su relleno no los distingue del panel (1,10:1), asi que
       el borde tiene que llegar al 3:1 que pide WCAG 1.4.11. #2D2B3A daba 1,26. */
    --control:#6B6885; --orange:#F79131; --orange-d:#E07A1A;
    --ok:#34D399; --radius:10px;
    --font:'DM Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--text); font:14px/1.45 var(--font); display:flex; flex-direction:column; overflow:hidden; }
  button, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; background:none; border:0; }
  :focus-visible { outline:2px solid var(--orange); outline-offset:2px; }

  /* ── Barra superior ── */
  .bar { display:flex; align-items:center; gap:18px; padding:10px 18px; border-bottom:1px solid var(--border);
         background:linear-gradient(90deg,#1A1524 0%,var(--card) 40%,var(--card) 100%); flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand img { width:30px; height:30px; border-radius:50%; }
  .brand h1 { font-size:15px; font-weight:700; letter-spacing:-.01em; margin:0; }
  .brand .tag { font:500 10px/1 var(--mono); letter-spacing:.14em; color:var(--orange); border:1px solid var(--orange-d); padding:4px 7px; border-radius:20px; }
  .seg { display:flex; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:3px; gap:2px; }
  .seg button { padding:6px 12px; border-radius:6px; color:var(--dim); font-weight:600; font-size:13px; }
  .seg button[aria-pressed="true"] { background:var(--purple); color:#fff; }
  .seg button.dice { color:var(--orange); }
  .seg button:hover:not([aria-pressed="true"]) { background:var(--hover); color:var(--text); }
  .grow { flex:1; }
  .acts { display:flex; gap:8px; }
  .btn { padding:8px 14px; border-radius:7px; font-weight:600; font-size:13px; border:1px solid var(--border); background:var(--card); color:var(--text); }
  .btn:hover { background:var(--hover); }
  .btn.primary { background:var(--orange); border-color:var(--orange); color:#141016; }
  .btn.primary:hover { background:var(--orange-d); }

  /* ── Cuerpo ── */
  main { flex:1; display:grid; grid-template-columns:380px 1fr; min-height:0; }
  aside { border-right:1px solid var(--border); overflow-y:auto; background:var(--bg); }
  .grp { padding:14px 16px 6px; }
  .grp h2 { font:600 11px/1 var(--mono); letter-spacing:.16em; color:var(--faint); text-transform:uppercase; margin:0 0 10px; }
  .fld { display:block; margin:0 0 10px; }
  .fld-l { display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  .fld select { width:100%; background:var(--card); border:1px solid var(--control); border-radius:6px; padding:7px 9px; font-size:13px; color:var(--text); }
  .fld input, .fld textarea { width:100%; background:var(--card); border:1px solid var(--control); border-radius:6px; padding:7px 9px; font-size:13px; line-height:1.4; resize:vertical; }
  .fld input:focus, .fld textarea:focus { border-color:var(--purple-l); outline:none; }
  .hint { font-size:12px; color:var(--orange); margin:0 0 10px; }

  /* Modo Entrega. Los numeros no son adorno: es una secuencia y el orden importa. */
  .paso h2 { display:flex; align-items:baseline; gap:8px; }
  .paso h2 .n { font:700 11px/1 var(--mono); color:var(--purple-l); }
  .paso h2 .n[data-hecho="1"] { color:var(--ok); }
  .suelta { border:1px dashed var(--control); border-radius:var(--radius); padding:20px 14px;
            text-align:center; color:var(--dim); font-size:13px; cursor:pointer;
            background:var(--bg); }
  .suelta:hover, .suelta.encima { border-color:var(--purple-l); color:var(--text); }
  .suelta b { color:var(--text); font-weight:700; }
  .minis { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px;
           margin:10px 0 4px; }
  .mini { position:relative; border:2px solid var(--border); border-radius:8px; overflow:hidden;
          background:var(--card); padding:0; text-align:left; cursor:pointer; }
  .mini img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; }
  .mini .rot { display:block; padding:5px 6px; font-size:11px; line-height:1.3; color:var(--dim);
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mini[aria-pressed="true"] { border-color:var(--purple-l); }
  .mini .ord { position:absolute; top:5px; left:5px; min-width:18px; height:18px; border-radius:9px;
               background:var(--purple); color:#fff; font:700 11px/18px var(--mono);
               text-align:center; }
  .mini .precio { position:absolute; top:5px; right:5px; background:var(--orange); color:#141016;
                  font:700 10px/1 var(--mono); padding:3px 5px; border-radius:4px; }
  .aviso-precio { font-size:12px; color:var(--orange); background:#2A1C10; border-radius:8px;
                  padding:9px 11px; margin:8px 0 0; }
  .fila-bt { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 10px; }
  .estado { font-size:12px; color:var(--dim); margin:0 0 10px; }
  .estado.mal { color:#F4A6B4; }
  .estado.bien { color:var(--ok); }

  /* perfil del destinatario: la decisión que más cambia el mensaje, arriba del todo */
  .pf { display:block; width:100%; text-align:left; border:1px solid var(--border); background:var(--card);
        border-radius:var(--radius); padding:10px 12px; margin:0 0 6px; transition:border-color .12s, background .12s; }
  .pf:hover { background:var(--hover); }
  .pf b { display:block; font-size:13px; font-weight:600; }
  .pf span { display:block; font-size:12px; line-height:1.45; color:var(--dim); margin-top:2px; }
  .pf[aria-pressed="true"] { border-color:var(--purple-l); background:linear-gradient(90deg,rgba(133,67,154,.22),transparent 70%); }
  .pf[aria-pressed="true"] b::before { content:'▸ '; color:var(--orange); }
  /* asuntos: el texto es lo que se va a pegar, asi que manda sobre la etiqueta */
  .asunto { position:relative; }
  .asunto .pf { padding-right:72px; }
  .pf .asunto-t { font-size:15px; font-weight:700; font-style:italic; color:var(--text);
                  line-height:1.35; margin-top:4px; }
  .asunto-c { position:absolute; top:9px; right:9px; font:600 11px/1 var(--mono);
              color:var(--orange); background:var(--bg); border:1px solid var(--control);
              border-radius:6px; padding:6px 9px; }
  .asunto-c:hover { background:var(--hover); color:var(--text); }

  .row { display:flex; align-items:center; gap:10px; padding:10px 2px 2px; }
  .row-t { flex:1; font-size:13px; }
  .row-t i { display:block; font-style:normal; font-size:12px; color:var(--dim); }

  /* banco de imagenes: la foto apagada es la que NO entra, para que se vea de un vistazo */
  .bk { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:0 0 10px; }
  .bk button { border:1px solid var(--border); border-radius:6px; overflow:hidden;
               background:var(--card); padding:0; text-align:left; }
  .bk img { display:block; width:100%; height:54px; object-fit:cover; opacity:.35; transition:opacity .12s; }
  .bk button[aria-pressed="true"] { border-color:var(--purple-l); }
  .bk button[aria-pressed="true"] img { opacity:1; }
  .bk i { display:block; font:10px/1.3 var(--mono); font-style:normal; padding:3px 5px;
          color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bk button[aria-pressed="true"] i { color:var(--text); }
  .aviso { font-size:12px; line-height:1.45; color:#F7C69B; background:rgba(247,145,49,.10);
           border:1px solid rgba(247,145,49,.38); border-radius:6px; padding:7px 9px; margin:0 0 10px; }
  .cmd { font:11px/1.5 var(--mono); color:var(--dim); background:var(--bg); border:1px solid var(--border);
         border-radius:6px; padding:6px 8px; margin:0 0 4px; word-break:break-all; }

  .blk { border:1px solid var(--border); border-radius:var(--radius); background:var(--card); margin:0 0 8px; overflow:hidden; }
  .blk-h { display:flex; align-items:center; gap:10px; padding:9px 12px; }
  .blk-t { flex:1; text-align:left; font-weight:600; font-size:13px; padding:2px 0; display:flex; justify-content:space-between; align-items:center; }
  .blk-t::after { content:'›'; color:var(--faint); font-size:16px; transform:rotate(90deg); transition:transform .15s; }
  .blk.open .blk-t::after { transform:rotate(-90deg); }
  .blk-b { display:none; padding:4px 12px 8px; border-top:1px solid var(--border); }
  .blk.open .blk-b { display:block; }
  .blk.off { opacity:.55; }
  .blk.off .blk-t { text-decoration:line-through; text-decoration-color:var(--faint); }

  .svc { border-left:2px solid var(--line); margin:8px 0 8px 4px; padding-left:10px; }
  .svc-h { display:flex; align-items:center; gap:8px; }
  .svc-t { flex:1; text-align:left; font-size:13px; padding:4px 0; color:var(--text); }
  .svc-b { display:none; padding-top:6px; }
  .svc.open .svc-b { display:block; }
  .svc.off .svc-t { color:var(--faint); text-decoration:line-through; }

  /* interruptor */
  .sw { position:relative; width:34px; height:20px; flex:none; }
  .sw input { position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; }
  .sw-k { position:absolute; inset:0; background:var(--line); border-radius:20px; transition:background .15s; }
  .sw-k::after { content:''; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:#fff; transition:transform .15s; }
  .sw input:checked + .sw-k { background:var(--orange); }
  .sw input:checked + .sw-k::after { transform:translateX(14px); }
  .sw input:focus-visible + .sw-k { outline:2px solid var(--orange); outline-offset:2px; }

  .reset { margin:6px 16px 20px; font-size:12px; color:var(--dim); text-decoration:underline; }

  /* ── Escenario de vista previa ── */
  #stage { display:flex; flex-direction:column; min-height:0; background:radial-gradient(1200px 600px at 70% -10%,rgba(133,67,154,.18),transparent 60%),radial-gradient(800px 400px at 0% 100%,rgba(247,145,49,.10),transparent 60%),var(--bg); }
  .stage-top { display:flex; align-items:center; gap:14px; padding:10px 18px; font-size:12px; color:var(--dim); border-bottom:1px solid var(--border); }
  .stage-top .seg { margin-left:auto; }
  .stage-top .seg button { padding:5px 10px; font-size:12px; }
  .stage-top .seg button[aria-pressed="true"] { background:var(--hover); color:var(--text); }
  .subj { color:var(--text); font-weight:600; }
  .meta { font:500 11px var(--mono); color:var(--faint); }
  .frame-wrap { flex:1; overflow:auto; display:flex; justify-content:center; padding:22px; }
  .frame { width:640px; max-width:100%; height:100%; background:#fff; border-radius:8px; box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px var(--border); overflow:hidden; transition:width .2s; }
  #stage.mobile .frame { width:375px; }
  iframe { width:100%; height:100%; border:0; display:block; background:#fff; }

  .toast { position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px); background:var(--card); border:1px solid var(--ok); color:var(--text); padding:9px 16px; border-radius:8px; font-size:13px; opacity:0; transition:.2s; pointer-events:none; }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  @media (max-width:900px) { main { grid-template-columns:1fr; } aside { max-height:45vh; border-right:0; border-bottom:1px solid var(--border); } }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><img src="img/logo.jpg" alt="" width="30" height="30"><h1>Compositor de mails</h1><span class="tag">PROTOTIPO</span></div>
  <div class="seg" id="tpl" role="group" aria-label="Plantilla"></div>
  <div class="grow"></div>
  <div class="acts">
    <button class="btn" id="copyText" type="button">Copiar texto</button>
    <button class="btn" id="copyHtml" type="button">Copiar HTML</button>
    <button class="btn" id="copyWa" type="button" hidden>Copiar para WhatsApp</button>
    <button class="btn primary" id="copyGmail" type="button">Copiar para pegar en Gmail</button>
  </div>
</header>
<main>
  <aside id="panel"></aside>
  <section id="stage">
    <div class="stage-top">
      <span class="subj" id="meta-subj"></span>
      <span class="meta" id="meta-tpl"></span>
      <span class="meta" id="meta-size"></span>
      <div class="seg">
        <button type="button" id="vDesk" aria-pressed="true">Escritorio</button>
        <button type="button" id="vMob" aria-pressed="false">Móvil</button>
        <button type="button" id="vImg" aria-pressed="false">Sin imágenes</button>
      </div>
    </div>
    <div class="frame-wrap"><div class="frame"><iframe id="preview" title="Vista previa del correo"></iframe></div></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="render.js"></script>
<script>
(function () {
  'use strict';
  const M = window.CentauroMail;
  // La clave incluye la version de contenido de render.js: si cambian los valores por defecto, lo guardado
  // en el navegador con datos viejos se ignora (evita que reaparezcan telefono/web/correo antiguos).
  const KEY = 'centauro-mail-proto-c' + (M.CONTENT_VERSION || 0);
  try { Object.keys(localStorage).filter(k => k.indexOf('centauro-mail-proto-') === 0 && k !== KEY).forEach(k => localStorage.removeItem(k)); } catch (e) { /* sin almacenamiento */ }
  // Segunda red: aunque la version coincida, lo guardado puede arrastrar datos de contacto YA RETIRADOS
  // (paso por aqui porque al usuario le reaparecieron el telefono y la web viejos). Si aparece cualquiera de
  // estos valores, el contenido guardado se descarta entero y se cargan los valores por defecto actuales.
  const RETIRADOS = ['412 000 0000', '412 1003559', 'www.centauroads.com', 'contacto@centauroads', 'publicitarios OOH + DOOH'];
  // Ademas: si lo guardado no trae el slogan (contenido anterior al bloque de marca), tambien se descarta.
  try { const r0 = localStorage.getItem(KEY); if (r0 && r0.indexOf('\"slogan\"') < 0) { localStorage.removeItem(KEY); } } catch (e) { /* sin almacenamiento */ }
  try {
    const raw = localStorage.getItem(KEY);
    if (raw && RETIRADOS.some(v => raw.indexOf(v) >= 0)) { localStorage.removeItem(KEY); }
  } catch (e) { /* sin almacenamiento */ }
  const $ = s => document.querySelector(s);
  const get = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
  const set = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function load() { try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* sin almacenamiento: seguimos en memoria */ } }
  // Normalizar al cargar: el panel se construye antes del primer render, y sin esto
  // un servicio retirado (Paradas) seguiria apareciendo en sus editores.
  let st = M.normaliza(load() || M.defaultState());
  let noImg = false;

  const ENVIO = [
    ['asunto', 'Asunto'],
    ['preheader', 'Preheader (texto de vista previa en la bandeja)', 'textarea'],
    ['destinatario', 'Destinatario (rellena {destinatario})'],
    ['imgSet', 'Imágenes de los servicios', 'select'],
    ['assetBaseProd', 'URL pública de las imágenes (se usa al copiar)'],
    ['linkBase', 'Base de links cortos (vacío = canva.link actuales)'],
    ['token', 'Token por destinatario (?c=)'],
  ];
  const BLOQUES = [
    { k: 'hero', label: 'Foto de cabecera (solo D)', hint: 'Archivo de img/. Solo la usa la plantilla D Cartelera móvil.',
      f: [['img', 'Foto real'], ['imgPortada', 'Portada Canva (cuando se elige ese juego)'], ['alt', 'Texto alternativo']] },
    { k: 'saludo', label: 'Saludo', f: [['texto', 'Texto', 'textarea']] },
    { k: 'intro', label: 'Introducción', f: [['texto', 'Párrafo', 'textarea']] },
    { k: 'titulo', label: 'Título de sección', f: [['texto', 'Título'], ['sub', 'Subtítulo']] },
    { k: 'servicios', label: 'Servicios (catálogo)', servicios: true },
    { k: 'asesor', label: 'Datos del formato del asesor (E, F, G)',
      hint: 'Estos datos CADUCAN. Revisalos antes de cada envio: una disponibilidad vieja o una fecha pasada se notan.',
      f: [['periodo', 'Periodo que se anuncia'], ['etiquetaMeta', 'Etiqueta de la cabecera'],
          ['dispoFecha', 'Disponibilidad actualizada al'], ['dispoTexto', 'Que hay disponible'],
          ['cierreTexto', 'Fecha de cierre'], ['slotsLed', 'Distintivo del LED (ej. 3 SLOTS)'],
          ['pieCta', 'Linea bajo el boton'], ['respuesta', 'Compromiso de respuesta']] },
    { k: 'clientes', label: 'Marcas que ya son clientes (solo perfil Cliente nuevo)',
      hint: 'APAGADO hasta que Elizabeth confirme que podemos nombrar a esas marcas.',
      f: [['titulo', 'Título'], ['lista', 'Marcas (separadas por ·)']] },
    { k: 'branding', label: 'Branding y esculturas (solo D)', hint: 'Sin foto todavía: pedir al equipo una imagen real de corpóreos o cajas de luz.',
      f: [['titulo', 'Título'], ['texto', 'Texto', 'textarea'], ['cta', 'Texto del botón'], ['url', 'Enlace']] },
    { k: 'suministro', label: 'Suministro e instalación', hint: 'En la plantilla D solo se muestran sus requisitos, dentro del bloque final.',
      f: [['titulo', 'Título'], ['texto', 'Texto', 'textarea'], ['requisitos', 'Requisitos (uno por línea)', 'lines']] },
    { k: 'pasos', label: 'Próximos pasos', f: [['titulo', 'Título'], ['texto', 'Texto', 'textarea']] },
    { k: 'presupuesto', label: 'Datos para presupuesto', f: [['titulo', 'Título'], ['items', 'Datos (uno por línea)', 'lines']] },
    { k: 'cta', label: 'Botón de acción', f: [['texto', 'Texto del botón'], ['url', 'Enlace']] },
    { k: 'cierre', label: 'Cierre', f: [['texto', 'Texto']] },
    { k: 'firma', label: 'Firma', hint: 'Teléfono y dirección son valores de ejemplo: confirmar con Elizabeth.',
      f: [['nombre', 'Nombre'],
          ['rol', 'Cargo (debajo del nombre)', 'opciones', M.ROLES],
          ['correo', 'Qué correo se enseña', 'opciones', M.CORREOS],
          ['slogan', 'Slogan (bajo el logo)'], ['linea', 'Línea de servicios (bajo el slogan)'],
          ['contacto', 'Correo de mercadeo'], ['email', 'Correo personal'],
          ['telefono', 'Teléfono'], ['ig', 'Instagram'], ['web', 'Web'], ['direccion', 'Dirección']] },
    { k: 'pie', label: 'Pie legal', f: [['texto', 'Texto', 'textarea']] },
  ];

  function inputEl(path, label, type, onInput) {
    const wrap = el('label', 'fld'); wrap.appendChild(el('span', 'fld-l', label));
    // 'opciones': selector de catalogo, con el mapa clave->etiqueta en el 4o argumento.
    // El 'select' de abajo esta clavado a M.IMG_SETS y no vale para nada mas.
    if (type === 'opciones') {
      const sel = document.createElement('select');
      Object.entries(onInput).forEach(([k, l]) => { const o = el('option', null, l); o.value = k; sel.appendChild(o); });
      sel.value = get(st, path) || Object.keys(onInput)[0];
      sel.addEventListener('change', () => { set(st, path, sel.value); touch(); });
      wrap.appendChild(sel); return wrap;
    }
    if (type === 'select') {
      const sel = document.createElement('select');
      Object.entries(M.IMG_SETS).forEach(([k, l]) => { const o = el('option', null, l); o.value = k; sel.appendChild(o); });
      sel.value = get(st, path) || 'fotos';
      sel.addEventListener('change', () => { set(st, path, sel.value); touch(); });
      wrap.appendChild(sel); return wrap;
    }
    const ta = type === 'textarea' || type === 'lines';
    const inp = document.createElement(ta ? 'textarea' : 'input'); if (!ta) inp.type = 'text'; else inp.rows = 3;
    const v = get(st, path); inp.value = type === 'lines' ? (Array.isArray(v) ? v.join('\n') : (v || '')) : (v == null ? '' : v);
    inp.addEventListener('input', () => { set(st, path, type === 'lines' ? inp.value.split('\n') : inp.value); if (typeof onInput === 'function') onInput(inp.value); touch(); });
    wrap.appendChild(inp); return wrap;
  }
  function switchEl(path, onChange) {
    const l = el('label', 'sw'); const c = document.createElement('input'); c.type = 'checkbox'; c.checked = !!get(st, path);
    c.setAttribute('aria-label', 'Mostrar u ocultar');
    c.addEventListener('change', () => { set(st, path, c.checked); onChange(c.checked); touch(); });
    l.appendChild(c); l.appendChild(el('i', 'sw-k')); return l;
  }
  function servicioEl(s, i) {
    const w = el('div', 'svc'); w.classList.toggle('off', !s.on);
    const h = el('div', 'svc-h'); h.appendChild(switchEl('servicios.' + i + '.on', on => w.classList.toggle('off', !on)));

  // Perfil del destinatario: reescribe asunto, textos y orden de servicios, y añade su bloque propio.
  function buildPerfil() {
    const g = el('div', 'grp'); g.appendChild(el('h2', null, 'Perfil del destinatario'));

      b.appendChild(el('b', null, pf.nombre)); b.appendChild(el('span', null, pf.desc));
      b.setAttribute('aria-pressed', String(st.perfil === k));
      b.addEventListener('click', () => {
        st.perfil = k;
        buildPanel();
        btns.forEach(([bb, kk]) => bb.setAttribute('aria-pressed', String(kk === k)));
        touch();
      });
      btns.push([b, k]); g.appendChild(b);
    });
    g.appendChild(el('p', 'hint', 'El perfil reescribe asunto, título, introducción, cierre y botón sobre la marcha: los campos de abajo siguen intactos y son los que se usan en el perfil General.'));
    // Claro u oscuro. Solo afecta a los formatos del asesor (E, F, G): los mios llevan

    ts.appendChild(tc); ts.appendChild(el('i', 'sw-k'));
    const tt = el('div', 'row-t'); tt.appendChild(document.createTextNode('Tema oscuro'));
    tt.appendChild(el('i', null, 'Solo cambia los formatos del asesor: E, F y G.'));
    tema.appendChild(ts); tema.appendChild(tt); g.appendChild(tema);

    const r = el('div', 'row');
    const sw = el('label', 'sw'); const c = document.createElement('input'); c.type = 'checkbox';
    c.checked = st.precios === 'desde'; c.setAttribute('aria-label', 'Mostrar precios desde');
    c.addEventListener('change', () => { st.precios = c.checked ? 'desde' : 'no'; touch(); });
    sw.appendChild(c); sw.appendChild(el('i', 'sw-k'));
    const t = el('div', 'row-t'); t.appendChild(document.createTextNode('Mostrar precios «desde»'));
    t.appendChild(el('i', null, 'Apagado: ningún importe. Encendido: precio de entrada por espacio.'));

  // Tres asuntos por perfil, mas la opcion de escribir el propio. El asunto es lo unico
  // que se ve antes de abrir el correo, asi que merece su propio bloque y no un campo mas.
  function buildAsuntos() {
    const g = el('div', 'grp'); g.appendChild(el('h2', null, 'Asunto del correo'));
    const lista = M.asuntosDe(st);
    const botones = [];
    const pinta = () => botones.forEach(([b, k]) => b.setAttribute('aria-pressed', String(k === st.asunto3)));
    lista.forEach(a => {
      // El boton de copiar va FUERA del de seleccionar, encima: un <button> dentro de
      // otro es HTML invalido y los lectores de pantalla se pierden.
      const fila = el('div', 'asunto');
      const b = el('button', 'pf'); b.type = 'button';
      b.appendChild(el('b', null, a.etiqueta));
      b.appendChild(el('span', 'asunto-t', a.texto));
      b.addEventListener('click', () => { st.asunto3 = a.clave; pinta(); touch(); });
      botones.push([b, a.clave]);
      fila.appendChild(b);

      const cp = el('button', 'asunto-c', 'Copiar'); cp.type = 'button';
      cp.setAttribute('aria-label', 'Copiar el asunto: ' + a.texto);
      cp.addEventListener('click', async ev => {
        ev.stopPropagation();          // copiar no debe cambiar el asunto elegido
        try { await navigator.clipboard.writeText(a.texto); toast('Asunto copiado'); }
        catch (e) { toast('No se pudo copiar el asunto'); }
      });
      fila.appendChild(cp);
      g.appendChild(fila);
    });
    const propio = el('button', 'pf'); propio.type = 'button';
    propio.appendChild(el('b', null, 'El mío'));
    propio.appendChild(el('span', null, 'Usa el que escribas abajo, en el campo Asunto.'));
    propio.addEventListener('click', () => { st.asunto3 = 'propio'; pinta(); touch(); });
    botones.push([propio, 'propio']); g.appendChild(propio);
    pinta();
    g.appendChild(el('p', 'hint', 'Los tres cambian con el perfil: no es lo mismo escribirle a una agencia que a quien nunca ha comprado exterior.'));
    g.appendChild(el('p', 'aviso', 'La l\u00ednea de asunto de un correo es texto plano: Gmail y Outlook NO muestran negrita, cursiva ni tama\u00f1o ah\u00ed. Los emojis s\u00ed llegan. Aqu\u00ed se ven destacados para poder compararlos.'));
    return g;
  }

  // Banco de efectos. Cada boton ensena el peso MEDIDO del GIF, no una promesa: el que
  // elige tiene que ver lo que le cuesta a quien abre el correo con datos moviles. Los
  // que no estan servidos se marcan, porque hay que generarlos antes de enviar.
  function buildEfectos() {
    const g = el('div', 'grp');
    g.appendChild(el('h2', null, 'Animacion de las fotos \u00b7 ' + M.EFECTOS.length + ' efectos'));

    const botones = [];
    const pinta = () => botones.forEach(([b, k]) => b.setAttribute('aria-pressed', String(k === st.efecto)));
    M.EFECTOS.forEach(e => {
      const b = el('button', 'pf'); b.type = 'button';
      const r = M.rangoPeso(e.clave);
      const peso = r[0] === r[1] ? r[0] + ' KB' : r[0] + '-' + r[1] + ' KB';
      b.appendChild(el('b', null, e.etiqueta + ' \u00b7 ' + peso + (e.servido ? '' : ' \u00b7 SIN SUBIR')));
      b.appendChild(el('span', null, e.idea));
      b.addEventListener('click', () => { st.efecto = e.clave; pinta(); touch(); });
      botones.push([b, e.clave]); g.appendChild(b);
    });
    pinta();

    // Excepciones por servicio. El encargo pedia poder elegir POR servicio, no solo uno
    // para todo: una valla y una pantalla LED no se lucen con lo mismo.
    g.appendChild(el('p', 'hint', 'Abajo, si un servicio concreto se luce con otro efecto, se le pone el suyo.'));
    M.SERVICIOS.forEach(sv => {
      const fila = el('label', 'fld');
      fila.appendChild(el('span', 'fld-l', sv.nombre));
      const sel = el('select');
      const opGlobal = el('option', null, 'El de todos'); opGlobal.value = ''; sel.appendChild(opGlobal);
      M.EFECTOS.forEach(e => {
        const o = el('option', null, e.etiqueta + ' \u00b7 ' + M.pesoDe(e.clave, sv) + ' KB');
        o.value = e.clave; sel.appendChild(o);
      });
      sel.value = st.efectosPorServicio[sv.id] || '';
      sel.addEventListener('change', () => {
        if (sel.value) st.efectosPorServicio[sv.id] = sel.value;
        else delete st.efectosPorServicio[sv.id];
        touch();
      });
      fila.appendChild(sel); g.appendChild(fila);
    });

    g.appendChild(el('p', 'hint',
      'El rango es el del servicio m\u00e1s ligero al m\u00e1s pesado; abajo, la cifra exacta de cada uno.'));
    const sinSubir = M.EFECTOS.filter(function (e) { return !e.servido; });
    if (sinSubir.length) {
      g.appendChild(el('p', 'aviso',
        'Sin subir: ' + sinSubir.map(function (e) { return e.etiqueta; }).join(', ') +
        '. Se puede elegir, pero la imagen sale rota hasta generarlo y subirlo a ' +
        'app/static/email/.'));
      g.appendChild(el('p', 'cmd',
        'python carrusel_gif.py --todos --efecto ' + sinSubir[0].clave));
    }
    return g;
  }

  // Banco de imagenes por servicio: que fotos entran en el carrusel, tres huecos para
  // anadir mas y el video. Un servicio por bloque plegable, que si no son cuatro listas
  // abiertas a la vez y no se encuentra nada.
  function buildBanco() {
    const g = el('div', 'grp');
    g.appendChild(el('h2', null, 'Banco de im\u00e1genes por servicio'));
    g.appendChild(el('p', 'hint',
      'La foto apagada no entra en el carrusel. El GIF est\u00e1 hecho de antemano: ' +
      'al cambiar la selecci\u00f3n, abajo sale el comando que lo regenera.'));

    const base = (st.assetBase || 'img').replace(/\/$/, '');
    const mio = id => (st.banco[id] = st.banco[id] || { usar: [], extra: ['', '', ''], video: { poster: '', enlace: '' } });

    M.SERVICIOS.forEach(sv => {
      const b = M.bancoDe(st, sv);
      const m = mio(sv.id);
      const blk = el('div', 'blk');
      const cab = el('div', 'blk-h');
      const tit = el('button', 'blk-t'); tit.type = 'button';
      tit.appendChild(el('span', null, sv.nombre));
      const cuenta = el('span', null, ''); tit.appendChild(cuenta);
      cab.appendChild(tit); blk.appendChild(cab);
      const cuerpo = el('div', 'blk-b'); blk.appendChild(cuerpo);
      tit.addEventListener('click', () => {
        blk.classList.toggle('open');
        cuerpo.style.display = blk.classList.contains('open') ? 'block' : 'none';
      });

      const cmd = el('p', 'cmd', '');
      const refresca = () => {
        const dentro = M.fotosDe(st, sv);
        cuenta.textContent = dentro.length + ' de ' + (b.fotos.length + b.extra.length);
        cmd.textContent = M.comandoCarrusel(st, sv);
      };

      // Las fotos del inventario, como interruptores.
      const rejilla = el('div', 'bk');
      const marcada = f => !m.usar.length || m.usar.indexOf(f) >= 0;
      b.fotos.forEach(f => {
        const bt = el('button'); bt.type = 'button';
        const im = el('img'); im.src = base + '/' + f; im.alt = f; im.loading = 'lazy';
        bt.appendChild(im); bt.appendChild(el('i', null, f.replace(/^svc_/, '')));
        const pinta = () => bt.setAttribute('aria-pressed', String(marcada(f)));
        pinta();
        bt.addEventListener('click', () => {
          // usar vacio significa "todas"; en cuanto se quita una hay que materializar la lista.
          if (!m.usar.length) m.usar = b.fotos.slice();
          const i = m.usar.indexOf(f);
          if (i >= 0) {
            if (m.usar.length === 1) return;   // sin fotos no hay carrusel: no se quita la ultima
            m.usar.splice(i, 1);
          } else {
            m.usar = b.fotos.filter(x => x === f || m.usar.indexOf(x) >= 0);
          }
          pinta(); refresca(); touch();
        });
        rejilla.appendChild(bt);
      });
      cuerpo.appendChild(rejilla);

      // Tres huecos para anadir. Se escribe el nombre del fichero -ya subido a
      // app/static/email/- o una URL completa.
      [0, 1, 2].forEach(i => {
        const f = el('label', 'fld');
        f.appendChild(el('span', 'fld-l', 'A\u00f1adir ' + (i + 1) + ' \u00b7 nombre de fichero o URL'));
        const inp = el('input'); inp.type = 'text'; inp.value = m.extra[i] || '';
        inp.placeholder = 'svc_' + sv.id + '_nueva.jpg';
        inp.addEventListener('input', () => { m.extra[i] = inp.value.trim(); refresca(); touch(); });
        f.appendChild(inp); cuerpo.appendChild(f);
      });

      // Video. No se incrusta: se manda un fotograma que enlaza al video completo,
      // que es lo unico que funciona en Gmail y en Outlook a la vez.
      if (b.aviso) cuerpo.appendChild(el('p', 'aviso', b.aviso));
      const fv = el('label', 'fld');
      fv.appendChild(el('span', 'fld-l', 'V\u00eddeo \u00b7 fotograma de portada'));
      const selv = el('select');
      const nada = el('option', null, 'Sin v\u00eddeo'); nada.value = ''; selv.appendChild(nada);
      b.videos.forEach(v => { const o = el('option', null, v.etiqueta); o.value = v.poster; selv.appendChild(o); });
      if (!b.videos.length) { selv.disabled = true; nada.textContent = 'No hay v\u00eddeo de este servicio'; }
      selv.value = m.video.poster || '';
      selv.addEventListener('change', () => { m.video.poster = selv.value; touch(); });
      fv.appendChild(selv); cuerpo.appendChild(fv);

      const fe = el('label', 'fld');
      fe.appendChild(el('span', 'fld-l', 'V\u00eddeo \u00b7 enlace al completo'));
      const inpe = el('input'); inpe.type = 'url'; inpe.value = m.video.enlace || '';
      inpe.placeholder = 'https://\u2026';
      inpe.addEventListener('input', () => { m.video.enlace = inpe.value.trim(); touch(); });
      fe.appendChild(inpe); cuerpo.appendChild(fe);

      cuerpo.appendChild(cmd);
      refresca();
      g.appendChild(blk);
    });
    return g;
  }

  // -- Modo Entrega ---------------------------------------------------------------------
  //
  // Cinco pasos, en orden. El contacto va el segundo y no el tercero: es obligatorio para crear
  // la entrega en el servidor (FR-102), y sin entrega creada no hay donde subir el PDF.
  //
  // Sin servidor -abierto como fichero suelto o como artefacto- el modo sigue sirviendo para
  // ver el formato: se pegan el enlace y la imagen a mano. Lo que no se puede es subir el PDF ni
  // guardar la entrega, y eso se dice, no se deja adivinar.
  const HAY_SERVIDOR = /^https?:$/.test(location.protocol);
  let paginasSubidas = [];   // lo que devolvio la subida: {indice, url, rotulo, aviso_precio}
  let elegidas = [];         // indices elegidos, EN ORDEN
  // Si se esta dando de alta un contacto a mano, y lo escrito hasta ahora. Vive FUERA de
  // buildPanel a proposito: el panel se repinta entero al cambiar el desplegable, y al nacer
  // de cero volvia a 'elige un contacto'. Los contactos que ya existen sobreviven a ese
  // repintado porque st.contactId los vuelve a marcar; el nuevo no tenia donde apoyarse.
  let contactoNuevo = false;
  const nuevoDatos = { nombre: '', empresa: '', email: '' };

  function api(ruta, opciones) {
    return fetch(ruta, Object.assign({ credentials: 'same-origin' }, opciones || {}))
      .then(r => r.json().then(d => {
        if (!r.ok) throw new Error(d.detail || 'Error del servidor');
        return d;
      }));
  }

  function pasoEl(numero, titulo, hecho) {
    const g = el('div', 'grp paso');
    const h = el('h2');
    const n = el('span', 'n', numero); n.setAttribute('data-hecho', hecho ? '1' : '0');
    h.appendChild(n); h.appendChild(el('span', null, titulo));
    g.appendChild(h);
    return g;
  }

  function botonEl(texto, clase, alPulsar) {
    const b = el('button', 'btn' + (clase ? ' ' + clase : ''), texto);
    b.type = 'button'; b.addEventListener('click', alPulsar);
    return b;
  }

  function estadoEl(texto, clase) { return el('p', 'estado' + (clase ? ' ' + clase : ''), texto); }

  function buildEntrega() {
    const E = st.bloques.entrega;
    const frag = document.createDocumentFragment();

    if (!HAY_SERVIDOR) {
      const nota = el('div', 'grp');
      nota.appendChild(el('p', 'hint',
        'Esta copia no habla con el servidor: puedes ver el formato pegando el enlace y la ' +
        'imagen a mano, pero para subir el PDF y guardar la entrega hay que abrirla en ' +
        'links.centauroads.com.'));
      frag.appendChild(nota);
    } else {
      // Sin sesion, todo lo que llama al servidor responde 401. Sin este aviso el panel se
      // queda callado: la lista de contactos sale vacia y el primer boton falla con un mensaje
      // que no explica nada. Decirlo cuanto antes ahorra el rodeo.
      const nota = el('div', 'grp'); nota.id = 'aviso-sesion'; nota.hidden = true;
      const p = el('p', 'hint', 'No has entrado al panel: guardar y subir no van a funcionar. ');
      const a = el('a', null, 'Entrar');
      a.href = '/panel/entrar?destino=' + encodeURIComponent(location.pathname);
      a.style.color = 'var(--purple-l)';
      p.appendChild(a); nota.appendChild(p); frag.appendChild(nota);
      api('/api/auth/yo').catch(() => { const n = $('#aviso-sesion'); if (n) n.hidden = false; });
    }

    // El aspecto, arriba del todo: es lo primero que se decide y lo que cambia el correo entero.
    // El interruptor de A-G no vale aqui —vive en un panel que este modo no pinta, y ademas tiene
    // dos posiciones para tres temas.
    const asp = el('div', 'grp');
    asp.appendChild(el('h2', null, 'Aspecto del correo'));
    const ASPECTOS = [
      ['claro', 'Claro', 'Papel blanco. El de siempre, y el que mejor se lee en cualquier bandeja.'],
      ['oscuro', 'Oscuro', 'Sobre negro, con el morado de acento. Elegante y sobrio.'],
      ['centauro', 'Centauro', 'El morado ES el fondo y el naranja manda: llega como un objeto de la marca, no como un documento.'],
    ];
    const botonesAsp = [];
    const pintaAsp = () => botonesAsp.forEach(([b, k]) =>
      b.setAttribute('aria-pressed', String(k === (st.temaEntrega || 'claro'))));
    ASPECTOS.forEach(([clave, nombre, idea]) => {
      const b = el('button', 'pf'); b.type = 'button';
      b.appendChild(el('b', null, nombre));
      b.appendChild(el('span', null, idea));
      b.addEventListener('click', () => { st.temaEntrega = clave; pintaAsp(); touch(); });
      botonesAsp.push([b, clave]); asp.appendChild(b);
    });
    pintaAsp();
    frag.appendChild(asp);

    // 01 - La presentacion
    const p1 = pasoEl('01', 'La presentación', !!E.url);
    p1.appendChild(inputEl('bloques.entrega.url', 'Enlace de Canva del cliente', 'text'));
    p1.appendChild(inputEl('bloques.entrega.titulo', 'Título de la propuesta', 'text'));
    p1.appendChild(inputEl('bloques.entrega.meta', 'Rótulo de la esquina', 'text'));

    // El asunto. Por defecto es el titulo -son la misma frase- pero quien redacta manda, asi que
    // hay un modo para escribirlo aparte. Reconstruye el panel al cambiar para que el campo del
    // asunto aparezca o desaparezca: un campo que se ignora es peor que no tenerlo.
    const modo = el('label', 'fld');
    modo.appendChild(el('span', 'fld-l', 'Asunto del correo'));
    const selA = el('select');
    [['auto', 'El mismo que el título'], ['propio', 'Escribirlo aparte']].forEach(par => {
      const o = el('option', null, par[1]); o.value = par[0];
      if ((st.asunto3 === 'propio') === (par[0] === 'propio')) o.selected = true;
      selA.appendChild(o);
    });
    selA.addEventListener('change', () => {
      st.asunto3 = selA.value === 'propio' ? 'propio' : 'directo';
      touch(); buildPanel();
    });
    modo.appendChild(selA);
    p1.appendChild(modo);
    if (st.asunto3 === 'propio') p1.appendChild(inputEl('asunto', 'Asunto', 'text'));
    if (HAY_SERVIDOR) {
      const est = estadoEl('');
      const fila = el('div', 'fila-bt');
      fila.appendChild(botonEl('Comprobar el enlace', null, () => {
        if (!E.url) { est.className = 'estado mal'; est.textContent = 'Primero pega el enlace.'; return; }
        est.className = 'estado'; est.textContent = 'Comprobando…';
        api('/api/entregas/comprobar-enlace', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: E.url }),
        }).then(r => {
          if (r.ok === true) { est.className = 'estado bien'; est.textContent = 'El enlace abre.'; }
          else if (r.ok === null) { est.className = 'estado'; est.textContent = r.motivo; }
          else { est.className = 'estado mal'; est.textContent = r.motivo || 'El enlace no abre.'; }
        }).catch(e => { est.className = 'estado mal'; est.textContent = e.message; });
      }));
      p1.appendChild(fila); p1.appendChild(est);
    }
    frag.appendChild(p1);

    // 02 - Para quien
    const p2 = pasoEl('02', 'Para quién', !!st.entregaId);
    p2.appendChild(el('p', 'fld-l',
      'Obligatorio. Sin contacto no se sabe quién abrió la propuesta, y sin eso no hay aviso.'));
    if (HAY_SERVIDOR) {
      const selWrap = el('label', 'fld');
      selWrap.appendChild(el('span', 'fld-l', 'Contacto'));
      const sel = el('select');
      const vacia = el('option', null, '— elige un contacto —'); vacia.value = ''; sel.appendChild(vacia);
      const nueva = el('option', null, '+ crear uno nuevo'); nueva.value = 'nuevo';
      if (contactoNuevo) nueva.selected = true;
      sel.appendChild(nueva);
      selWrap.appendChild(sel);
      // Se guarda la lista entera, no solo los identificadores: al elegir a alguien hay que
      // poder meter su nombre y su empresa en el correo, y volver a preguntarselo al servidor
      // por cada cambio de seleccion seria pedir dos veces lo mismo.
      let contactos = [];
      api('/api/contactos').then(cs => {
        contactos = cs;
        cs.forEach(c => {
          const o = el('option', null, c.nombre + (c.empresa ? ' · ' + c.empresa : ''));
          o.value = String(c.id);
          if (st.contactId === c.id) o.selected = true;
          sel.appendChild(o);
        });
      }).catch(() => { /* sin sesion: el paso 2 lo dira al guardar */ });

      const nuevoWrap = el('div'); nuevoWrap.hidden = !contactoNuevo;
      const campos = {};
      [['nombre', 'Nombre (obligatorio)'], ['empresa', 'Empresa (obligatorio)'],
       ['email', 'Correo']].forEach(par => {
        const w = el('label', 'fld'); w.appendChild(el('span', 'fld-l', par[1]));
        const i = el('input'); i.type = par[0] === 'email' ? 'email' : 'text';
        // Lo escrito se guarda segun se escribe: el panel puede repintarse en medio.
        i.value = nuevoDatos[par[0]] || '';
        i.addEventListener('input', () => { nuevoDatos[par[0]] = i.value; });
        campos[par[0]] = i; w.appendChild(i); nuevoWrap.appendChild(w);
      });
      sel.addEventListener('change', () => {
        contactoNuevo = sel.value === 'nuevo';
        nuevoWrap.hidden = !contactoNuevo;
        st.contactId = (sel.value && sel.value !== 'nuevo') ? Number(sel.value) : null;
        // El correo saluda a quien va dirigido, no a un ejemplo del catalogo. Elegir contacto
        // rellena el saludo y el texto en el acto, para que se vea en la vista previa.
        const elegido = contactos.filter(c => c.id === st.contactId)[0];
        if (elegido) {
          st.destinatario = elegido.nombre;
          st.bloques.entrega.empresa = elegido.empresa || '';
        }
        touch();
        buildPanel();
      });
      p2.appendChild(selWrap); p2.appendChild(nuevoWrap);

      const est2 = estadoEl(st.entregaId ? 'Entrega guardada (#' + st.entregaId + ').' : '',
                            st.entregaId ? 'bien' : '');
      const fila2 = el('div', 'fila-bt');
      fila2.appendChild(botonEl(st.entregaId ? 'Actualizar Personalizada' : 'Guardar Personalizada',
                                'primary', () => guardaEntrega(campos, sel, est2)));
      p2.appendChild(fila2); p2.appendChild(est2);
    }
    frag.appendChild(p2);

    // 03 - Las paginas
    const p3 = pasoEl('03', 'Las páginas', elegidas.length >= 2);
    if (HAY_SERVIDOR) {
      const suelta = el('div', 'suelta');
      suelta.innerHTML = 'Suelta aquí el <b>PDF que descarga Canva</b>, o varias imágenes';
      const fichero = el('input'); fichero.type = 'file';
      fichero.accept = '.pdf,image/*'; fichero.multiple = true; fichero.hidden = true;
      suelta.addEventListener('click', () => fichero.click());
      ['dragover', 'dragenter'].forEach(ev => suelta.addEventListener(ev, e => {
        e.preventDefault(); suelta.classList.add('encima');
      }));
      ['dragleave', 'drop'].forEach(ev => suelta.addEventListener(ev, () => suelta.classList.remove('encima')));
      suelta.addEventListener('drop', e => {
        e.preventDefault();
        if (e.dataTransfer.files && e.dataTransfer.files.length) sube(e.dataTransfer.files);
      });
      fichero.addEventListener('change', () => { if (fichero.files.length) sube(fichero.files); });
      p3.appendChild(suelta); p3.appendChild(fichero);

      const filaC = el('div', 'fila-bt');
      filaC.appendChild(botonEl('¿Sin el PDF? Pedírselo a Claude', null, pideAClaude));
      p3.appendChild(filaC);

      const est3 = estadoEl(''); est3.id = 'est-paginas'; p3.appendChild(est3);
      const rejilla = el('div', 'minis'); rejilla.id = 'minis'; p3.appendChild(rejilla);
      if (paginasSubidas.length) pintaMinis(rejilla, est3);

      // El efecto, aqui mismo. El banco de A-G vive en un panel que este modo no pinta, asi que
      // no habia forma de elegirlo: el servidor recibia el que quedara de otra plantilla. Al
      // cambiarlo se rehace el carrusel en el acto, que es lo unico que demuestra que se aplico.
      const efe = el('label', 'fld');
      efe.appendChild(el('span', 'fld-l', 'Efecto del carrusel'));
      const selEfe = el('select');
      M.EFECTOS.forEach(x => {
        const o = el('option', null, x.etiqueta); o.value = x.clave;
        o.title = x.idea;
        if ((st.efectoEntrega || 'barrido') === x.clave) o.selected = true;
        selEfe.appendChild(o);
      });
      selEfe.addEventListener('change', () => {
        st.efectoEntrega = selEfe.value; save();
        if (elegidas.length >= 2) { armaCarrusel(est3); return; }
        // Tras recargar la pagina no queda nada en memoria, pero el carrusel YA armado sigue en
        // el correo con el efecto de antes. Decir "guardado" ahi seria la misma mentira que este
        // paso vino a quitar: se enviaria creyendo que se aplico.
        if (st.entregaId && st.bloques.entrega.img) {
          est3.className = 'estado mal';
          est3.textContent = 'El carrusel que lleva el correo sigue con el efecto anterior. ' +
            'Vuelve a subir el PDF y elige las páginas para rehacerlo.';
        } else {
          est3.className = 'estado';
          est3.textContent = 'Efecto guardado. Elige de 2 a 4 páginas y se arma solo.';
        }
      });
      efe.appendChild(selEfe); p3.appendChild(efe);

      p3.appendChild(el('p', 'aviso-precio',
        'El aviso de precio solo detecta precios escritos como texto. Si en la presentación el ' +
        'precio es parte de una imagen, no se detecta: míralas antes de entregar.'));
    } else {
      p3.appendChild(inputEl('bloques.entrega.img', 'Dirección de la imagen de portada', 'text'));
    }
    frag.appendChild(p3);

    // 04 - El mensaje
    const p4 = pasoEl('04', 'El mensaje', true);
    p4.appendChild(inputEl('bloques.entrega.texto', 'Texto de la entrega (correo)', 'textarea'));
    p4.appendChild(inputEl('bloques.entrega.corto', 'Versión corta (WhatsApp)', 'textarea'));
    p4.appendChild(inputEl('bloques.entrega.cta', 'Texto del botón', 'text'));
    p4.appendChild(el('p', 'fld-l',
      'Los servicios que la acompañan se eligen en «Espacios que la acompañan», más abajo.'));
    frag.appendChild(p4);

    // 05 - Llevartela
    const p5 = pasoEl('05', 'Llevártela', false);
    p5.appendChild(el('p', 'fld-l',
      'El envío es manual: esta herramienta no manda correos. Copia, pega en Gmail y envía tú.'));
    const fila5 = el('div', 'fila-bt');
    fila5.appendChild(botonEl('Copiar para Gmail', 'primary', () => $('#copyGmail').click()));
    fila5.appendChild(botonEl('Copiar para WhatsApp', null, copiaWhatsApp));
    p5.appendChild(fila5);
    if (HAY_SERVIDOR) {
      const est5 = estadoEl('');
      const fila6 = el('div', 'fila-bt');
      fila6.appendChild(botonEl('Marcar como entregada', null, () => {
        if (!st.entregaId) {
          est5.className = 'estado mal'; est5.textContent = 'Guarda la entrega primero.'; return;
        }
        api('/api/entregas/' + st.entregaId + '/entregada', { method: 'POST' })
          .then(() => { est5.className = 'estado bien'; est5.textContent = 'Anotada como entregada.'; })
          .catch(e => { est5.className = 'estado mal'; est5.textContent = e.message; });
      }));
      p5.appendChild(fila6); p5.appendChild(est5);
    }
    frag.appendChild(p5);

    return frag;
  }

  function guardaEntrega(campos, sel, est) {
    const E = st.bloques.entrega;
    if (!E.url || !E.titulo) {
      est.className = 'estado mal'; est.textContent = 'Faltan el enlace y el título (paso 1).'; return;
    }
    const cuerpo = {
      titulo: E.titulo, canva_url: E.url, texto: E.texto || '',
      servicios: st.servicios.filter(x => x.on).map(x => x.id).join(','),
    };
    if (sel.value === 'nuevo') {
      // Nombre y empresa son obligatorios: el correo los dice en el saludo y en el texto, y una
      // propuesta personalizada que no nombra a quien va dirigida no esta personalizada.
      if (!campos.nombre.value.trim() || !campos.empresa.value.trim()) {
        est.className = 'estado mal';
        est.textContent = 'Hacen falta el nombre y la empresa: el correo los nombra.';
        return;
      }
      cuerpo.contacto = { nombre: campos.nombre.value.trim(), email: campos.email.value.trim(),
                          empresa: campos.empresa.value.trim(), origen: '' };
      st.destinatario = cuerpo.contacto.nombre;
      st.bloques.entrega.empresa = cuerpo.contacto.empresa;
    } else if (st.contactId) {
      cuerpo.contact_id = st.contactId;
    } else {
      est.className = 'estado mal'; est.textContent = 'Elige un contacto o crea uno.'; return;
    }
    est.className = 'estado'; est.textContent = 'Guardando…';
    const ruta = st.entregaId ? '/api/entregas/' + st.entregaId : '/api/entregas';
    api(ruta, { method: st.entregaId ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) })
      .then(d => {
        st.entregaId = d.id; st.contactId = d.contact_id;
        // Ya esta dado de alta: el desplegable lo listara como uno mas.
        contactoNuevo = false;
        nuevoDatos.nombre = nuevoDatos.empresa = nuevoDatos.email = '';
        // El correo saluda con lo que dice el SERVIDOR, no con lo que haya en pantalla. Antes
        // esto solo se rellenaba al crear un contacto nuevo: al elegir uno que ya existia, el
        // correo seguia con el nombre de ejemplo del catalogo y nadie se enteraba hasta verlo.
        if (d.contacto_nombre) st.destinatario = d.contacto_nombre;
        st.bloques.entrega.empresa = d.contacto_empresa || '';
        // El enlace que se manda al cliente. Sin esto el correo llevaba a Canva y la apertura
        // no se registraba en ninguna parte.
        st.bloques.entrega.enlace = location.origin + d.enlace;
        save(); touch();
        est.className = 'estado bien';
        est.textContent = 'Guardada (#' + d.id + '). Enlace del cliente: ' + location.origin + d.enlace;
        // Se repinta el panel y se rehace la vista previa en el acto: nadie deberia tener que
        // pulsar F5 para ver lo que acaba de guardar.
        buildPanel(); renderPreview();
      })
      .catch(e => { est.className = 'estado mal'; est.textContent = e.message; });
  }

  function sube(ficheros) {
    const est = $('#est-paginas');
    if (!st.entregaId) {
      est.className = 'estado mal';
      est.textContent = 'Guarda la entrega en el paso 2 antes de subir las páginas.';
      return;
    }
    const lista = Array.prototype.slice.call(ficheros);
    est.className = 'estado';
    est.textContent = 'Leyendo ' + (lista.length === 1 ? lista[0].name : lista.length + ' ficheros') + '…';
    const datos = new FormData();
    lista.forEach(f => datos.append('fichero', f));
    api('/api/entregas/' + st.entregaId + '/paginas', { method: 'POST', body: datos })
      .then(d => {
        paginasSubidas = d.paginas; elegidas = [];
        // En cuanto hay paginas, el correo ensena la primera. Antes se quedaba con el marcador
        // de posicion hasta elegir dos, y mientras tanto mostraba una foto del catalogo como si
        // fuera la propuesta del cliente.
        if (d.paginas.length) {
          st.bloques.entrega.img = location.origin + d.paginas[0].url;
          save(); touch();
        }
        est.className = 'estado';
        est.textContent = d.paginas.length + ' páginas. Elige de 2 a 4, en el orden que quieras.';
        pintaMinis($('#minis'), est);
      })
      .catch(e => { est.className = 'estado mal'; est.textContent = e.message; });
  }

  function pintaMinis(rejilla, est) {
    rejilla.innerHTML = '';
    paginasSubidas.forEach(pg => {
      const b = el('button', 'mini'); b.type = 'button';
      const pos = elegidas.indexOf(pg.indice);
      b.setAttribute('aria-pressed', String(pos >= 0));
      const img = el('img'); img.src = pg.url; img.alt = pg.rotulo; b.appendChild(img);
      b.appendChild(el('span', 'rot', pg.rotulo));
      if (pos >= 0) b.appendChild(el('span', 'ord', String(pos + 1)));
      if (pg.aviso_precio) {
        const t = el('span', 'precio', 'precio');
        t.title = 'Esta página parece llevar un precio escrito';
        b.appendChild(t);
      }
      b.addEventListener('click', () => {
        const i = elegidas.indexOf(pg.indice);
        if (i >= 0) elegidas.splice(i, 1);
        else if (elegidas.length < 4) elegidas.push(pg.indice);
        else { est.className = 'estado mal'; est.textContent = 'Como mucho 4 páginas.'; return; }
        pintaMinis(rejilla, est);
        // Con una sola elegida no hay carrusel: el correo sigue ensenando la portada quieta. Si
        // no se dice, parece acabado -y se entrega una imagen fija creyendo que anima.
        if (elegidas.length >= 2) armaCarrusel(est);
        else {
          est.className = 'estado mal';
          est.textContent = elegidas.length
            ? 'Una sola página es una portada quieta. Elige al menos otra para que anime.'
            : 'Sin páginas elegidas el correo lleva la portada quieta. Elige de 2 a 4.';
        }
      });
      rejilla.appendChild(b);
    });
  }

  function armaCarrusel(est) {
    est.className = 'estado'; est.textContent = 'Armando el carrusel…';
    api('/api/entregas/' + st.entregaId + '/paginas', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      // El efecto propio de la Personalizada, el del paso 03. No es el de A-G: alli cada
      // efecto es un GIF ya subido; aqui lo arma el servidor con las paginas del cliente.
      body: JSON.stringify({ indices: elegidas, efecto: st.efectoEntrega || 'barrido' }),
    }).then(d => {
      // La imagen del correo pasa a ser la del servidor, en direccion absoluta: es lo que
      // descargara el proxy de Gmail.
      st.bloques.entrega.img = location.origin + (d.carrusel || d.portada || '');
      save();
      est.className = 'estado bien';
      est.textContent = 'Carrusel listo con ' + elegidas.length + ' páginas.';
      touch();
    }).catch(e => { est.className = 'estado mal'; est.textContent = e.message; });
  }

  function pideAClaude() {
    const E = st.bloques.entrega;
    const orden = 'Con el conector de Canva, exporta en JPG a 1200 px de ancho las páginas 1, 2 y 3 ' +
      'de esta presentación y dame los enlaces de descarga: ' + (E.url || '<pega aquí el enlace>');
    navigator.clipboard.writeText(orden).then(
      () => {
        toast('Instrucción copiada. Pégala en Claude.');
        window.open('https://claude.ai/new', '_blank', 'noopener');
      },
      () => toast('No se pudo copiar'));
  }

  // Copiar texto plano, con el mismo respaldo que ya usaban los demas botones. El portapapeles
  // moderno exige que la pagina tenga el foco, y en algunos navegadores ademas permiso; el
  // metodo clasico funciona donde el otro no. Estaba al lado desde el principio y no lo use.
  async function copiaTexto(texto) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(texto);
        return true;
      }
    } catch (e) { /* cae al metodo clasico */ }
    const t = document.createElement("textarea");
    t.value = texto; t.style.cssText = "position:fixed;left:-9999px;top:0;";
    document.body.appendChild(t); t.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    t.remove(); return ok;
  }

  async function copiaWhatsApp() {
    const texto = M.renderWhatsApp(prod());
    toast(await copiaTexto(texto)
      ? "WhatsApp copiado · un solo enlace, al principio"
      : "No se pudo copiar");
  }

  function buildPanel() {
    const p = $('#panel'); p.innerHTML = '';
    $('#copyWa').hidden = st.plantilla !== 'H';
    if (st.plantilla === 'H') {
      p.appendChild(buildEntrega());
      const g = el('div', 'grp'); g.appendChild(el('h2', null, 'Espacios que la acompañan'));
      st.servicios.forEach((sv, i) => g.appendChild(servicioEl(sv, i)));
      p.appendChild(g);
      const gb = el('div', 'grp'); gb.appendChild(el('h2', null, 'Saludo, firma y pie'));
      BLOQUES.filter(d => ['saludo', 'firma', 'pie'].indexOf(d.k) >= 0)
        .forEach(d => gb.appendChild(blockEl(d)));
      p.appendChild(gb);
      return;
    }
    p.appendChild(buildPerfil());
    p.appendChild(buildAsuntos());
    p.appendChild(buildEfectos());
    p.appendChild(buildBanco());
    const g1 = el('div', 'grp'); g1.appendChild(el('h2', null, 'Envío'));
    ENVIO.forEach(([k, l, ty]) => g1.appendChild(inputEl(k, l, ty))); p.appendChild(g1);
    const g2 = el('div', 'grp'); g2.appendChild(el('h2', null, 'Bloques del mensaje · interruptor = mostrar / inhibir'));
    BLOQUES.forEach(d => g2.appendChild(blockEl(d))); p.appendChild(g2);
    const r = el('button', 'reset', 'Restablecer todo el contenido'); r.type = 'button';
    r.addEventListener('click', () => { st = M.defaultState(); save(); buildPanel(); buildSeg(); renderPreview(); toast('Contenido restablecido'); });
    p.appendChild(r);
  }
  function buildSeg() {
    const seg = $('#tpl'); seg.innerHTML = '';
    Object.keys(M.TEMPLATES).forEach(k => {
      const b = el('button', null, k + ' · ' + M.TEMPLATES[k].nombre); b.type = 'button'; b.title = M.TEMPLATES[k].desc;
      b.setAttribute('aria-pressed', String(st.plantilla === k));
      // buildPanel tambien: el modo Entrega tiene su propio panel, y hasta ahora todas las
      // plantillas compartian el mismo, asi que nadie lo reconstruia al cambiar de plantilla.
      b.addEventListener('click', () => { st.plantilla = k; buildSeg(); buildPanel(); touch(); });
      seg.appendChild(b);
    });
    const d = el('button', 'dice', '⚄ Aleatoria'); d.type = 'button'; d.title = 'Elige otra plantilla al azar (rotación)';
    d.addEventListener('click', () => { const ks = Object.keys(M.TEMPLATES).filter(k => k !== st.plantilla); st.plantilla = ks[Math.floor(Math.random() * ks.length)]; buildSeg(); buildPanel(); touch(); });
    seg.appendChild(d);
  }

  const prod = () => { const p = JSON.parse(JSON.stringify(st)); p.assetBase = st.assetBaseProd || 'img'; return p; };
  let timer;
  function touch() { save(); clearTimeout(timer); timer = setTimeout(renderPreview, 120); }
  function renderPreview() {
    const key = M.pick(st);
    let html = M.render(st, key);
    // En el compositor autonomo no hay carpeta img/: lo que no venga incrustado hay que
    // pedirlo a produccion, o la vista previa sale con las fotos rotas.
    html = html.replace(/src="img\/([^"]+)"/g, (m, n) => {
      if (window.IMG_DATA && window.IMG_DATA[n]) return 'src="' + window.IMG_DATA[n] + '"';
      if (window.IMG_DATA) return 'src="' + (st.assetBaseProd || '') + '/' + n + '"';
      return m;
    });
    // "Sin imagenes" tiene que ensenar lo que ve de verdad quien las tiene bloqueadas: el TEXTO
    // ALTERNATIVO en el hueco de cada foto. Antes se hacia con `img{display:none}`, que las
    // esconde y esconde tambien el alt: daba por buena una plantilla que con las imagenes
    // bloqueadas se quedaba muda. Quitando el `src` el navegador pinta el alt, que es justo lo
    // que hace Outlook (constitucion, principio III).
    const cuerpo = noImg ? html.replace(/\ssrc="[^"]*"/g, '') : html;
    const extra = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap"><base target="_blank">' +
      (noImg ? '<style>img{border:1px dashed #9895A7!important;min-height:22px}</style>' : '');
    $('#preview').srcdoc = cuerpo.replace('</head>', extra + '</head>');
    $('#meta-tpl').textContent = 'Plantilla ' + key + ' · ' + M.TEMPLATES[key].nombre + ' · ' + M.PERFILES[st.perfil].nombre + ' · ' + (st.imgSet === 'portadas' ? 'portadas Canva' : 'fotos reales');
    $('#meta-size').textContent = Math.round(M.render(prod(), key).length / 1024) + ' KB HTML';
    $('#meta-subj').textContent = M.aplicaPerfil(st).asunto;
  }

  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }
  async function copyRich(html, text) {
    try {
      if (navigator.clipboard && window.ClipboardItem) {
        await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })]);
        return true;
      }
    } catch (e) { /* cae al método clásico */ }
    const d = document.createElement('div'); d.contentEditable = 'true'; d.style.cssText = 'position:fixed;left:-9999px;top:0;'; d.innerHTML = html;
    document.body.appendChild(d); const r = document.createRange(); r.selectNodeContents(d);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    sel.removeAllRanges(); d.remove(); return ok;
  }
  $('#copyGmail').addEventListener('click', async () => {
    const full = M.render(prod()); const body = (full.match(/<body[^>]*>([\s\S]*)<\/body>/) || [0, full])[1];
    toast((await copyRich(body, M.renderText(prod()))) ? 'Copiado: pega en un correo nuevo de Gmail (Ctrl+V)' : 'No se pudo copiar: el navegador bloqueó el portapapeles');
  });
  $('#copyHtml').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(M.render(prod())); toast('HTML completo copiado'); } catch (e) { toast('No se pudo copiar el HTML'); }
  });
    // El boton de la barra. Estaba puesto y sin conectar: se vaciaba el hueco visual y no hacia
  // nada al pulsarlo. El del paso 05 si funcionaba, asi que el fallo dependia de por donde
  // entrara cada quien.
  $('#copyWa').addEventListener('click', copiaWhatsApp);
  $('#copyText').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(M.renderText(prod())); toast('Versión en texto plano copiada'); } catch (e) { toast('No se pudo copiar el texto'); }
  });
  $('#vDesk').addEventListener('click', () => { $('#stage').classList.remove('mobile'); $('#vDesk').setAttribute('aria-pressed', 'true'); $('#vMob').setAttribute('aria-pressed', 'false'); });
  $('#vMob').addEventListener('click', () => { $('#stage').classList.add('mobile'); $('#vDesk').setAttribute('aria-pressed', 'false'); $('#vMob').setAttribute('aria-pressed', 'true'); });
  $('#vImg').addEventListener('click', () => { noImg = !noImg; $('#vImg').setAttribute('aria-pressed', String(noImg)); renderPreview(); });

  // El logo de la cabecera va escrito como img/logo.jpg, que es lo correcto en local.
  // En el autonomo viene incrustado; en la copia publicada en /static/email/ hay que
  // apuntarlo a la base real, o sale roto -pasaba, y solo se vio al probarlo servido.
  (function () {
    const im = document.querySelector('.brand img');
    if (!im) return;
    if (window.IMG_DATA && window.IMG_DATA['logo.jpg']) { im.src = window.IMG_DATA['logo.jpg']; return; }
    if (window.ASSET_BASE) im.src = String(window.ASSET_BASE).replace(/\/$/, '') + '/logo.jpg';
  })();
  buildPanel(); buildSeg(); renderPreview();
})();
</script>
