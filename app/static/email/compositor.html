  // Tres asuntos por perfil, mas la opcion de escribir el propio. El asunto es lo unico
  // que se ve antes de abrir el correo, asi que merece su propio bloque y no un campo mas.
  function buildAsuntos() {
    const g = el('div', 'grp'); g.appendChild(el('h2', null, 'Asunto del correo'));
    const lista = M.asuntosDe(st);
    const botones = [];
    const pinta = () => botones.forEach(([b, k]) => b.setAttribute('aria-pressed', String(k === st.asunto3)));
    lista.forEach(a => {
      // El boton de copiar va FUERA del de seleccionar, encima: un <button> dentro de
      // otro es HTML invalido y los lectores de pantalla se pierden.
      const fila = el('div', 'asunto');
      const b = el('button', 'pf'); b.type = 'button';
      b.appendChild(el('b', null, a.etiqueta));
      b.appendChild(el('span', 'asunto-t', a.texto));
      b.addEventListener('click', () => { st.asunto3 = a.clave; pinta(); touch(); });
      botones.push([b, a.clave]);
      fila.appendChild(b);

      const cp = el('button', 'asunto-c', 'Copiar'); cp.type = 'button';
      cp.setAttribute('aria-label', 'Copiar el asunto: ' + a.texto);
      cp.addEventListener('click', async ev => {
        ev.stopPropagation();          // copiar no debe cambiar el asunto elegido
        try { await navigator.clipboard.writeText(a.texto); toast('Asunto copiado'); }
        catch (e) { toast('No se pudo copiar el asunto'); }
      });
      fila.appendChild(cp);
      g.appendChild(fila);
    });
    const propio = el('button', 'pf'); propio.type = 'button';
    propio.appendChild(el('b', null, 'El mío'));
    propio.appendChild(el('span', null, 'Usa el que escribas abajo, en el campo Asunto.'));
    propio.addEventListener('click', () => { st.asunto3 = 'propio'; pinta(); touch(); });
    botones.push([propio, 'propio']); g.appendChild(propio);
    pinta();
    g.appendChild(el('p', 'hint', 'Los tres cambian con el perfil: no es lo mismo escribirle a una agencia que a quien nunca ha comprado exterior.'));
    g.appendChild(el('p', 'aviso', 'La l\u00ednea de asunto de un correo es texto plano: Gmail y Outlook NO muestran negrita, cursiva ni tama\u00f1o ah\u00ed. Los emojis s\u00ed llegan. Aqu\u00ed se ven destacados para poder compararlos.'));
    return g;
  }

  // Banco de efectos. Cada boton ensena el peso MEDIDO del GIF, no una promesa: el que
  // elige tiene que ver lo que le cuesta a quien abre el correo con datos moviles. Los
  // que no estan servidos se marcan, porque hay que generarlos antes de enviar.
  function buildEfectos() {
    const g = el('div', 'grp');
    g.appendChild(el('h2', null, 'Animacion de las fotos \u00b7 ' + M.EFECTOS.length + ' efectos'));

    const botones = [];
    const pinta = () => botones.forEach(([b, k]) => b.setAttribute('aria-pressed', String(k === st.efecto)));
    M.EFECTOS.forEach(e => {
      const b = el('button', 'pf'); b.type = 'button';
      const r = M.rangoPeso(e.clave);
      const peso = r[0] === r[1] ? r[0] + ' KB' : r[0] + '-' + r[1] + ' KB';
      b.appendChild(el('b', null, e.etiqueta + ' \u00b7 ' + peso + (e.servido ? '' : ' \u00b7 SIN SUBIR')));
      b.appendChild(el('span', null, e.idea));
      b.addEventListener('click', () => { st.efecto = e.clave; pinta(); touch(); });
      botones.push([b, e.clave]); g.appendChild(b);
    });
    pinta();

    // Excepciones por servicio. El encargo pedia poder elegir POR servicio, no solo uno
    // para todo: una valla y una pantalla LED no se lucen con lo mismo.
    g.appendChild(el('p', 'hint', 'Abajo, si un servicio concreto se luce con otro efecto, se le pone el suyo.'));
    M.SERVICIOS.forEach(sv => {
      const fila = el('label', 'fld');
      fila.appendChild(el('span', 'fld-l', sv.nombre));
      const sel = el('select');
      const opGlobal = el('option', null, 'El de todos'); opGlobal.value = ''; sel.appendChild(opGlobal);
      M.EFECTOS.forEach(e => {
        const o = el('option', null, e.etiqueta + ' \u00b7 ' + M.pesoDe(e.clave, sv) + ' KB');
        o.value = e.clave; sel.appendChild(o);
      });
      sel.value = st.efectosPorServicio[sv.id] || '';
      sel.addEventListener('change', () => {
        if (sel.value) st.efectosPorServicio[sv.id] = sel.value;
        else delete st.efectosPorServicio[sv.id];
        touch();
      });
      fila.appendChild(sel); g.appendChild(fila);
    });

    g.appendChild(el('p', 'hint',
      'El rango es el del servicio m\u00e1s ligero al m\u00e1s pesado; abajo, la cifra exacta de cada uno.'));
    const sinSubir = M.EFECTOS.filter(function (e) { return !e.servido; });
    if (sinSubir.length) {
      g.appendChild(el('p', 'aviso',
        'Sin subir: ' + sinSubir.map(function (e) { return e.etiqueta; }).join(', ') +
        '. Se puede elegir, pero la imagen sale rota hasta generarlo y subirlo a ' +
        'app/static/email/.'));
      g.appendChild(el('p', 'cmd',
        'python carrusel_gif.py --todos --efecto ' + sinSubir[0].clave));
    }
    return g;
  }

  // Banco de imagenes por servicio: que fotos entran en el carrusel, tres huecos para
  // anadir mas y el video. Un servicio por bloque plegable, que si no son cuatro listas
  // abiertas a la vez y no se encuentra nada.
  function buildBanco() {
    const g = el('div', 'grp');
    g.appendChild(el('h2', null, 'Banco de im\u00e1genes por servicio'));
    g.appendChild(el('p', 'hint',
      'La foto apagada no entra en el carrusel. El GIF est\u00e1 hecho de antemano: ' +
      'al cambiar la selecci\u00f3n, abajo sale el comando que lo regenera.'));

    const base = (st.assetBase || 'img').replace(/\/$/, '');
    const mio = id => (st.banco[id] = st.banco[id] || { usar: [], extra: ['', '', ''], video: { poster: '', enlace: '' } });

    M.SERVICIOS.forEach(sv => {
      const b = M.bancoDe(st, sv);
      const m = mio(sv.id);
      const blk = el('div', 'blk');
      const cab = el('div', 'blk-h');
      const tit = el('button', 'blk-t'); tit.type = 'button';
      tit.appendChild(el('span', null, sv.nombre));
      const cuenta = el('span', null, ''); tit.appendChild(cuenta);
      cab.appendChild(tit); blk.appendChild(cab);
      const cuerpo = el('div', 'blk-b'); blk.appendChild(cuerpo);
      tit.addEventListener('click', () => {
        blk.classList.toggle('open');
        cuerpo.style.display = blk.classList.contains('open') ? 'block' : 'none';
      });

      const cmd = el('p', 'cmd', '');
      const refresca = () => {
        const dentro = M.fotosDe(st, sv);
        cuenta.textContent = dentro.length + ' de ' + (b.fotos.length + b.extra.length);
        cmd.textContent = M.comandoCarrusel(st, sv);
      };

      // Las fotos del inventario, como interruptores.
      const rejilla = el('div', 'bk');
      const marcada = f => !m.usar.length || m.usar.indexOf(f) >= 0;
      b.fotos.forEach(f => {
        const bt = el('button'); bt.type = 'button';
        const im = el('img'); im.src = base + '/' + f; im.alt = f; im.loading = 'lazy';
        bt.appendChild(im); bt.appendChild(el('i', null, f.replace(/^svc_/, '')));
        const pinta = () => bt.setAttribute('aria-pressed', String(marcada(f)));
        pinta();
        bt.addEventListener('click', () => {
          // usar vacio significa "todas"; en cuanto se quita una hay que materializar la lista.
          if (!m.usar.length) m.usar = b.fotos.slice();
          const i = m.usar.indexOf(f);
          if (i >= 0) {
            if (m.usar.length === 1) return;   // sin fotos no hay carrusel: no se quita la ultima
            m.usar.splice(i, 1);
          } else {
            m.usar = b.fotos.filter(x => x === f || m.usar.indexOf(x) >= 0);
          }
          pinta(); refresca(); touch();
        });
        rejilla.appendChild(bt);
      });
      cuerpo.appendChild(rejilla);

      // Tres huecos para anadir. Se escribe el nombre del fichero -ya subido a
      // app/static/email/- o una URL completa.
      [0, 1, 2].forEach(i => {
        const f = el('label', 'fld');
        f.appendChild(el('span', 'fld-l', 'A\u00f1adir ' + (i + 1) + ' \u00b7 nombre de fichero o URL'));
        const inp = el('input'); inp.type = 'text'; inp.value = m.extra[i] || '';
        inp.placeholder = 'svc_' + sv.id + '_nueva.jpg';
        inp.addEventListener('input', () => { m.extra[i] = inp.value.trim(); refresca(); touch(); });
        f.appendChild(inp); cuerpo.appendChild(f);
      });

      // Video. No se incrusta: se manda un fotograma que enlaza al video completo,
      // que es lo unico que funciona en Gmail y en Outlook a la vez.
      if (b.aviso) cuerpo.appendChild(el('p', 'aviso', b.aviso));
      const fv = el('label', 'fld');
      fv.appendChild(el('span', 'fld-l', 'V\u00eddeo \u00b7 fotograma de portada'));
      const selv = el('select');
      const nada = el('option', null, 'Sin v\u00eddeo'); nada.value = ''; selv.appendChild(nada);
      b.videos.forEach(v => { const o = el('option', null, v.etiqueta); o.value = v.poster; selv.appendChild(o); });
      if (!b.videos.length) { selv.disabled = true; nada.textContent = 'No hay v\u00eddeo de este servicio'; }
      selv.value = m.video.poster || '';
      selv.addEventListener('change', () => { m.video.poster = selv.value; touch(); });
      fv.appendChild(selv); cuerpo.appendChild(fv);

      const fe = el('label', 'fld');
      fe.appendChild(el('span', 'fld-l', 'V\u00eddeo \u00b7 enlace al completo'));
      const inpe = el('input'); inpe.type = 'url'; inpe.value = m.video.enlace || '';
      inpe.placeholder = 'https://\u2026';
      inpe.addEventListener('input', () => { m.video.enlace = inpe.value.trim(); touch(); });
      fe.appendChild(inpe); cuerpo.appendChild(fe);

      cuerpo.appendChild(cmd);
      refresca();
      g.appendChild(blk);
    });
    return g;
  }

  // -- Modo Entrega ---------------------------------------------------------------------
  //
  // Cinco pasos, en orden. El contacto va el segundo y no el tercero: es obligatorio para crear
  // la entrega en el servidor (FR-102), y sin entrega creada no hay donde subir el PDF.
  //
  // Sin servidor -abierto como fichero suelto o como artefacto- el modo sigue sirviendo para
  // ver el formato: se pegan el enlace y la imagen a mano. Lo que no se puede es subir el PDF ni
  // guardar la entrega, y eso se dice, no se deja adivinar.
  const HAY_SERVIDOR = /^https?:$/.test(location.protocol);
  // Equipo y salida apuntan al servidor: en la copia autonoma no llevarian a ninguna parte.
  if (HAY_SERVIDOR && document.getElementById('menu')) document.getElementById('menu').hidden = false;
  // Lo subido y lo elegido de cada galeria de paginas: la de la presentacion principal y la de cada
  // espacio que la acompana (004). Vive FUERA de buildPanel: el panel se repinta entero y no puede
  // perder lo que la persona ya eligio. paginas: {indice, url, rotulo, aviso_precio}; elegidas, EN ORDEN.
  const galerias = {};
  const galeriaDe = clave => galerias[clave] || (galerias[clave] = { paginas: [], elegidas: [], efecto: '' });
  // Si se esta dando de alta un contacto a mano, y lo escrito hasta ahora. Vive FUERA de
  // buildPanel a proposito: el panel se repinta entero al cambiar el desplegable, y al nacer
  // de cero volvia a 'elige un contacto'. Los contactos que ya existen sobreviven a ese
  // repintado porque st.contactId los vuelve a marcar; el nuevo no tenia donde apoyarse.
  let contactoNuevo = false;
  const nuevoDatos = { nombre: '', empresa: '', email: '' };

  function api(ruta, opciones) {
    return fetch(ruta, Object.assign({ credentials: 'same-origin' }, opciones || {}))
      .then(r => r.json().then(d => {
        if (!r.ok) { const e = new Error(d.detail || 'Error del servidor'); e.status = r.status; throw e; }
        return d;
      }));
  }

  function pasoEl(numero, titulo, hecho) {
    const g = el('div', 'grp paso');
    const h = el('h2');
    const n = el('span', 'n', numero); n.setAttribute('data-hecho', hecho ? '1' : '0');
    h.appendChild(n); h.appendChild(el('span', null, titulo));
    g.appendChild(h);
    return g;
  }

  function botonEl(texto, clase, alPulsar) {
    const b = el('button', 'btn' + (clase ? ' ' + clase : ''), texto);
    b.type = 'button'; b.addEventListener('click', alPulsar);
    return b;
  }

  function estadoEl(texto, clase) {
    const p = el('p', 'estado' + (clase ? ' ' + clase : ''), texto);
    p.setAttribute('role', 'status'); p.setAttribute('aria-live', 'polite'); return p;
  }
  // Un error del servidor, junto al boton que lo provoco. Si es de sesion, con la salida al lado:
  // el aviso general esta arriba del todo y, con el panel bajado, nadie lo ve. «Hay que entrar al
  // panel» a secas dejaba sin saber que hacer.
  function falla(est, e) {
    est.className = 'estado mal';
    if (e && e.status === 401) {
      est.textContent = 'No has entrado al panel en este navegador (o la sesión caducó: dura 8 horas). ';
      const a = el('a', null, 'Entrar y volver aquí');
      a.href = '/panel/entrar?destino=' + encodeURIComponent(location.pathname);
      a.style.color = 'var(--purple-l)';
      est.appendChild(a);
      return;
    }
    est.textContent = e && e.message ? e.message : 'Error del servidor';
  }

  function buildEntrega() {
    const E = st.bloques.entrega;
    const frag = document.createDocumentFragment();

    if (!HAY_SERVIDOR) {
      const nota = el('div', 'grp');
      nota.appendChild(el('p', 'hint',
        'Esta copia no habla con el servidor: puedes ver el formato pegando el enlace y la ' +
        'imagen a mano, pero para subir el PDF y guardar la entrega hay que abrirla en ' +
        'links.centauroads.com.'));
      frag.appendChild(nota);
    } else {
      // Sin sesion, todo lo que llama al servidor responde 401. Sin este aviso el panel se
      // queda callado: la lista de contactos sale vacia y el primer boton falla con un mensaje
      // que no explica nada. Decirlo cuanto antes ahorra el rodeo.
      const nota = el('div', 'grp'); nota.id = 'aviso-sesion'; nota.hidden = true;
      const p = el('p', 'hint', 'No has entrado al panel: guardar y subir no van a funcionar. ');
      const a = el('a', null, 'Entrar');
      a.href = '/panel/entrar?destino=' + encodeURIComponent(location.pathname);
      a.style.color = 'var(--purple-l)';
      p.appendChild(a); nota.appendChild(p); frag.appendChild(nota);
      api('/api/auth/yo').catch(() => { const n = $('#aviso-sesion'); if (n) n.hidden = false; });
    }

    // El aspecto, arriba del todo: es lo primero que se decide y lo que cambia el correo entero.
    // El interruptor de A-G no vale aqui —vive en un panel que este modo no pinta, y ademas tiene
    // dos posiciones para tres temas.
    // Que entrega se esta editando, abrir otra guardada o empezar una nueva (004, US4).
    if (HAY_SERVIDOR) frag.appendChild(grupoEntrega());

    const asp = el('div', 'grp');
    asp.appendChild(el('h2', null, 'Aspecto del correo'));
    const ASPECTOS = [
      ['claro', 'Claro', 'Papel blanco. El de siempre, y el que mejor se lee en cualquier bandeja.'],
      ['oscuro', 'Oscuro', 'Sobre negro, con el morado de acento. Elegante y sobrio.'],
      ['centauro', 'Centauro', 'El morado ES el fondo y el naranja manda: llega como un objeto de la marca, no como un documento.'],
    ];
    const botonesAsp = [];
    const pintaAsp = () => botonesAsp.forEach(([b, k]) =>
      b.setAttribute('aria-pressed', String(k === (st.temaEntrega || 'claro'))));
    ASPECTOS.forEach(([clave, nombre, idea]) => {
      const b = el('button', 'pf'); b.type = 'button';
      b.appendChild(el('b', null, nombre));
      b.appendChild(el('span', null, idea));
      b.addEventListener('click', () => { st.temaEntrega = clave; pintaAsp(); touch(); });
      botonesAsp.push([b, clave]); asp.appendChild(b);
    });
    pintaAsp();
    frag.appendChild(asp);

    // 01 - La presentacion
    const p1 = pasoEl('01', 'La presentación', !!E.url);
    p1.appendChild(inputEl('bloques.entrega.url', 'Enlace de Canva del cliente', 'text'));
    p1.appendChild(inputEl('bloques.entrega.titulo', 'Título de la propuesta', 'text'));
    p1.appendChild(inputEl('bloques.entrega.meta', 'Rótulo de la esquina', 'text'));

    // El asunto. Por defecto es el titulo -son la misma frase- pero quien redacta manda, asi que
    // hay un modo para escribirlo aparte. Reconstruye el panel al cambiar para que el campo del
    // asunto aparezca o desaparezca: un campo que se ignora es peor que no tenerlo.
    const modo = el('label', 'fld');
    modo.appendChild(el('span', 'fld-l', 'Asunto del correo'));
    const selA = el('select');
    [['auto', 'El mismo que el título'], ['propio', 'Escribirlo aparte']].forEach(par => {
      const o = el('option', null, par[1]); o.value = par[0];
      if ((st.asunto3 === 'propio') === (par[0] === 'propio')) o.selected = true;
      selA.appendChild(o);
    });
    selA.addEventListener('change', () => {
      st.asunto3 = selA.value === 'propio' ? 'propio' : 'directo';
      touch(); buildPanel();
    });
    modo.appendChild(selA);
    p1.appendChild(modo);
    if (st.asunto3 === 'propio') p1.appendChild(inputEl('asunto', 'Asunto', 'text'));
    if (HAY_SERVIDOR) {
      const est = estadoEl('');
      const fila = el('div', 'fila-bt');
      fila.appendChild(botonEl('Comprobar el enlace', null, () => {
        if (!E.url) { est.className = 'estado mal'; est.textContent = 'Primero pega el enlace.'; return; }
        est.className = 'estado'; est.textContent = 'Comprobando…';
        api('/api/entregas/comprobar-enlace', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: E.url }),
        }).then(r => {
          if (r.ok === true) { est.className = 'estado bien'; est.textContent = 'El enlace abre.'; }
          else if (r.ok === null) { est.className = 'estado'; est.textContent = r.motivo; }
          else { est.className = 'estado mal'; est.textContent = r.motivo || 'El enlace no abre.'; }
        }).catch(e => falla(est, e));
      }));
      p1.appendChild(fila); p1.appendChild(est);
    }
    frag.appendChild(p1);

    // 02 - Para quien
    const p2 = pasoEl('02', 'Para quién', !!st.entregaId);
    p2.appendChild(el('p', 'fld-l',
      'Obligatorio. Sin contacto no se sabe quién abrió la propuesta, y sin eso no hay aviso.'));
    if (HAY_SERVIDOR) {
      const selWrap = el('label', 'fld');
      selWrap.appendChild(el('span', 'fld-l', 'Contacto'));
      const sel = el('select');
      const vacia = el('option', null, '— elige un contacto —'); vacia.value = ''; sel.appendChild(vacia);
      const nueva = el('option', null, '+ crear uno nuevo'); nueva.value = 'nuevo';
      if (contactoNuevo) nueva.selected = true;
      sel.appendChild(nueva);
      selWrap.appendChild(sel);
      // Se guarda la lista entera, no solo los identificadores: al elegir a alguien hay que
      // poder meter su nombre y su empresa en el correo, y volver a preguntarselo al servidor
      // por cada cambio de seleccion seria pedir dos veces lo mismo.
      let contactos = [];
      api('/api/contactos').then(cs => {
        contactos = cs;
        cs.forEach(c => {
          const o = el('option', null, c.nombre + (c.empresa ? ' · ' + c.empresa : ''));
          o.value = String(c.id);
          if (st.contactId === c.id) o.selected = true;
          sel.appendChild(o);
        });
      }).catch(() => { /* sin sesion: el paso 2 lo dira al guardar */ });

      const nuevoWrap = el('div'); nuevoWrap.hidden = !contactoNuevo;
      const campos = {};
      [['nombre', 'Nombre (obligatorio)'], ['empresa', 'Empresa (obligatorio)'],
       ['email', 'Correo']].forEach(par => {
        const w = el('label', 'fld'); w.appendChild(el('span', 'fld-l', par[1]));
        const i = el('input'); i.type = par[0] === 'email' ? 'email' : 'text';
        // Lo escrito se guarda segun se escribe: el panel puede repintarse en medio.
        i.value = nuevoDatos[par[0]] || '';
        i.addEventListener('input', () => { nuevoDatos[par[0]] = i.value; });
        campos[par[0]] = i; w.appendChild(i); nuevoWrap.appendChild(w);
      });
      sel.addEventListener('change', () => {
        contactoNuevo = sel.value === 'nuevo';
        nuevoWrap.hidden = !contactoNuevo;
        st.contactId = (sel.value && sel.value !== 'nuevo') ? Number(sel.value) : null;
        // El correo saluda a quien va dirigido, no a un ejemplo del catalogo. Elegir contacto
        // rellena el saludo y el texto en el acto, para que se vea en la vista previa.
        const elegido = contactos.filter(c => c.id === st.contactId)[0];
        if (elegido) {
          st.destinatario = elegido.nombre;
          st.bloques.entrega.empresa = elegido.empresa || '';
        }
        touch();
        buildPanel();
      });
      p2.appendChild(selWrap); p2.appendChild(nuevoWrap);

      const est2 = estadoEl(st.entregaId ? 'Entrega guardada (#' + st.entregaId + ').' : '',
                            st.entregaId ? 'bien' : '');
      const fila2 = el('div', 'fila-bt');
      fila2.appendChild(botonEl(st.entregaId ? 'Actualizar Personalizada' : 'Guardar Personalizada',
                                'primary', () => guardaEntrega(campos, sel, est2)));
      p2.appendChild(fila2); p2.appendChild(est2);
    }
    frag.appendChild(p2);

    // 03 - Las paginas
    const p3 = pasoEl('03', 'Las páginas', galeriaDe('principal').elegidas.length >= 2);
    if (HAY_SERVIDOR) {
      galeria({
        g: galeriaDe('principal'),
        ruta: () => st.entregaId ? '/api/entregas/' + st.entregaId + '/paginas' : null,
        efecto: () => st.efectoEntrega || 'barrido',
        ponEfecto: v => { st.efectoEntrega = v; save(); },
        hayCarrusel: () => !!(st.entregaId && st.bloques.entrega.img),
        // En cuanto hay paginas, el correo ensena la primera. Antes se quedaba con el marcador de
        // posicion hasta elegir dos, y mientras tanto mostraba una foto del catalogo como si fuera
        // la propuesta del cliente.
        alSubir: d => { if (d.paginas.length) { st.bloques.entrega.img = location.origin + d.paginas[0].url; save(); touch(); } },
        // La imagen del correo pasa a ser la del servidor, en direccion absoluta: es lo que
        // descargara el proxy de Gmail.
        alArmar: d => { st.bloques.entrega.img = location.origin + (d.carrusel || d.portada || ''); save(); touch(); },
        claude: () => pideAClaude(st.bloques.entrega.url),
      }).forEach(n => p3.appendChild(n));
    } else {
      p3.appendChild(inputEl('bloques.entrega.img', 'Dirección de la imagen de portada', 'text'));
    }
    frag.appendChild(p3);

    // 04 - El mensaje
    const p4 = pasoEl('04', 'El mensaje', true);
    p4.appendChild(inputEl('bloques.entrega.texto', 'Texto de la entrega (correo)', 'textarea'));
    p4.appendChild(inputEl('bloques.entrega.corto', 'Versión corta (WhatsApp)', 'textarea'));
    p4.appendChild(inputEl('bloques.entrega.cta', 'Texto del botón', 'text'));
    p4.appendChild(inputEl('bloques.entrega.cierre', 'Despedida (antes de la firma)', 'textarea'));
    p4.appendChild(el('p', 'fld-l',
      'Los servicios que la acompañan se eligen en «Espacios que la acompañan», más abajo.'));

    // Las dos secciones que se pueden añadir. El interruptor es de la entrega; los textos son los
    // MISMOS que usan los correos de catálogo, a propósito: así «para cotizar necesitamos» existe
    // una sola vez. Se avisa, porque editarlos aquí los cambia también allí.
    const extra = el('div', 'grp');
    extra.appendChild(el('h2', null, 'Secciones que se pueden añadir'));
    extra.appendChild(el('p', 'hint',
      'Vienen apagadas. Los textos son los mismos de los correos de catálogo: si los cambias ' +
      'aquí, cambian también allí — que es lo que se quiere, para no tener dos versiones.'));

    [['conSuministro', 'Suministro e instalación',
      [['bloques.suministro.titulo', 'Título', 'text'],
       ['bloques.suministro.texto', 'Texto', 'textarea'],
       ['bloques.suministro.requisitos', 'Qué hace falta (uno por línea)', 'textarea']]],
     ['conPasos', 'Próximos pasos',
      [['bloques.pasos.titulo', 'Título', 'text'],
       ['bloques.pasos.texto', 'Texto', 'textarea'],
       ['bloques.presupuesto.titulo', 'Título de la lista', 'text'],
       ['bloques.presupuesto.items', 'Lista numerada (uno por línea)', 'textarea']]],
    ].forEach(([clave, nombre, campos]) => {
      const b = el('section', 'blk');
      const apagado = () => b.classList.toggle('off', !st.bloques.entrega[clave]);
      const head = el('header', 'blk-h');
      head.appendChild(switchEl('bloques.entrega.' + clave, apagado, nombre));
      const t = el('button', 'blk-t', nombre); t.type = 'button';
      plegable(t, b);
      head.appendChild(t); b.appendChild(head);
      const body = el('div', 'blk-b');
      campos.forEach(([ruta, etiqueta, tipo]) => body.appendChild(inputEl(ruta, etiqueta, tipo)));
      b.appendChild(body); apagado(); extra.appendChild(b);
    });
    p4.appendChild(extra);
    frag.appendChild(p4);

    // 05 - Llevartela
    const p5 = pasoEl('05', 'Llevártela', false);
    p5.appendChild(el('p', 'fld-l',
      'El envío es manual: esta herramienta no manda correos. Copia, pega en Gmail y envía tú.'));
    const fila5 = el('div', 'fila-bt');
    fila5.appendChild(botonEl('Copiar para Gmail', 'primary', () => $('#copyGmail').click()));
    fila5.appendChild(botonEl('Copiar para WhatsApp', null, copiaWhatsApp));
    p5.appendChild(fila5);
    if (HAY_SERVIDOR) {
      const est5 = estadoEl('');
      const fila6 = el('div', 'fila-bt');
      fila6.appendChild(botonEl('Marcar como entregada', null, () => {
        if (!st.entregaId) {
          est5.className = 'estado mal'; est5.textContent = 'Guarda la entrega primero.'; return;
        }
        api('/api/entregas/' + st.entregaId + '/entregada', { method: 'POST' })
          .then(() => { est5.className = 'estado bien'; est5.textContent = 'Anotada como entregada.'; })
          .catch(e => falla(est5, e));
      }));
      p5.appendChild(fila6); p5.appendChild(est5);
    }
    frag.appendChild(p5);

    return frag;
  }

  // ── La entrega que se esta armando (004, US4) ──
  // El servidor guarda cada entrega, pero el compositor no sabia volver a una: todo vivia en el
  // navegador donde se armo. Y sin «Empezar una nueva», guardar la entrega del siguiente cliente
  // la escribia ENCIMA de la anterior (PUT sobre el mismo id).
  function grupoEntrega() {
    const E = st.bloques.entrega;
    const g = el('div', 'grp');
    g.appendChild(el('h2', null, 'La entrega'));
    g.appendChild(el('p', 'hint', st.entregaId
      ? 'Estás editando la entrega #' + st.entregaId + (E.titulo ? ' · ' + E.titulo : '') +
        (st.contactId && st.destinatario ? ' — ' + st.destinatario : '') + '. Lo que guardes va sobre ella.'
      : 'Entrega nueva: se crea al guardarla en el paso 2.'));
    const est = estadoEl('');
    const lab = el('label', 'fld');
    lab.appendChild(el('span', 'fld-l', 'Abrir una entrega guardada'));
    const sel = el('select');
    sel.appendChild(el('option', null, 'Cargando las entregas guardadas…')).value = '';
    lab.appendChild(sel); g.appendChild(lab);
    const aviso = () => 'Se deja de editar la entrega #' + st.entregaId +
      '. Queda guardada y la puedes volver a abrir. ¿Seguir?';
    const fila = el('div', 'fila-bt');
    fila.appendChild(botonEl('Abrir', 'primary', () => {
      if (!sel.value) { est.className = 'estado mal'; est.textContent = 'Elige una entrega de la lista.'; return; }
      if (st.entregaId && String(st.entregaId) !== sel.value && !confirm(aviso())) return;
      est.className = 'estado'; est.textContent = 'Abriendo…';
      api('/api/entregas/' + encodeURIComponent(sel.value)).then(abreEntrega).catch(e => falla(est, e));
    }));
    fila.appendChild(botonEl('Empezar una nueva', null, () => {
      if (st.entregaId && !confirm(aviso())) return;
      nuevaEntrega();
    }));
    g.appendChild(fila); g.appendChild(est);
    api('/api/entregas').then(lista => {
      sel.textContent = '';
      sel.appendChild(el('option', null, lista.length ? 'Elige una…' : 'Aún no hay entregas guardadas')).value = '';
      lista.forEach(d => {
        const o = el('option', null, '#' + d.id + ' · ' + d.titulo + ' — ' + d.contacto_nombre +
          (d.contacto_empresa ? ' (' + d.contacto_empresa + ')' : '') + (d.estado === 'entregada' ? ' · entregada' : ''));
        o.value = String(d.id);
        if (d.id === st.entregaId) o.selected = true;
        sel.appendChild(o);
      });
    }).catch(e => falla(est, e));
    return g;
  }

  // Carga lo que el servidor guarda de una entrega. Lo que no guarda -rotulo de la esquina, texto
  // corto de WhatsApp, aspecto, efecto- se queda como estaba en este compositor.
  function abreEntrega(d) {
    const E = st.bloques.entrega;
    const abs = u => u ? location.origin + u : '';
    E.url = d.canva_url; E.titulo = d.titulo;
    if (d.texto) E.texto = d.texto;
    E.empresa = d.contacto_empresa || '';
    E.enlace = abs(d.enlace);
    // Sin imagenes no hay imagen: dejar la de la entrega anterior enseñaria la propuesta de otro.
    E.img = abs(d.carrusel || d.portada || (d.paginas && d.paginas[0] ? d.paginas[0].url : ''));
    E.incluidos = d.servicios ? d.servicios.split(',').filter(Boolean) : [];
    E.espacios = {};
    (d.espacios || []).forEach(x => {
      const pr = {};
      if (x.canva_url) pr.canva = x.canva_url;
      if (x.nombre) pr.nombre = x.nombre;
      if (x.cobertura) pr.cobertura = x.cobertura;
      if (x.carrusel) pr.carrusel = abs(x.carrusel);
      if (Object.keys(pr).length) E.espacios[x.linea] = pr;
    });
    st.entregaId = d.id; st.contactId = d.contact_id;
    if (d.contacto_nombre) st.destinatario = d.contacto_nombre;
    st.plantilla = 'H';
    // Las miniaturas eran de otra entrega: se vuelven a subir si hace falta; el carrusel ya armado sigue.
    Object.keys(galerias).forEach(k => delete galerias[k]);
    save(); buildSeg(); buildPanel(); renderPreview();
    toast('Entrega #' + d.id + ' abierta');
  }

  // La entrega vuelve al principio. El aspecto y el efecto, que son gusto de quien redacta, se quedan.
  function nuevaEntrega() {
    const base = M.defaultState();
    st.bloques.entrega = base.bloques.entrega;
    delete st.entregaId; delete st.contactId;
    st.destinatario = base.destinatario;
    contactoNuevo = false;
    nuevoDatos.nombre = nuevoDatos.empresa = nuevoDatos.email = '';
    Object.keys(galerias).forEach(k => delete galerias[k]);
    save(); buildPanel(); renderPreview();
    toast('Entrega nueva: guárdala en el paso 2 para crearla.');
  }

  function guardaEntrega(campos, sel, est) {
    const E = st.bloques.entrega;
    if (!E.url || !E.titulo) {
      est.className = 'estado mal'; est.textContent = 'Faltan el enlace y el título (paso 1).'; return;
    }
    const cuerpo = {
      titulo: E.titulo, canva_url: E.url, texto: E.texto || '',
      // Los espacios de ESTA entrega (004), no el `on` de las plantillas A-G.
      servicios: (E.incluidos || []).join(','),
    };
    if (sel.value === 'nuevo') {
      // Nombre y empresa son obligatorios: el correo los dice en el saludo y en el texto, y una
      // propuesta personalizada que no nombra a quien va dirigida no esta personalizada.
      if (!campos.nombre.value.trim() || !campos.empresa.value.trim()) {
        est.className = 'estado mal';
        est.textContent = 'Hacen falta el nombre y la empresa: el correo los nombra.';
        return;
      }
      cuerpo.contacto = { nombre: campos.nombre.value.trim(), email: campos.email.value.trim(),
                          empresa: campos.empresa.value.trim(), origen: '' };
      st.destinatario = cuerpo.contacto.nombre;
      st.bloques.entrega.empresa = cuerpo.contacto.empresa;
    } else if (st.contactId) {
      cuerpo.contact_id = st.contactId;
    } else {
      est.className = 'estado mal'; est.textContent = 'Elige un contacto o crea uno.'; return;
    }
    est.className = 'estado'; est.textContent = 'Guardando…';
    const ruta = st.entregaId ? '/api/entregas/' + st.entregaId : '/api/entregas';
    api(ruta, { method: st.entregaId ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo) })
      .then(d => {
        st.entregaId = d.id; st.contactId = d.contact_id;
        // Ya esta dado de alta: el desplegable lo listara como uno mas.
        contactoNuevo = false;
        nuevoDatos.nombre = nuevoDatos.empresa = nuevoDatos.email = '';
        // El correo saluda con lo que dice el SERVIDOR, no con lo que haya en pantalla. Antes
        // esto solo se rellenaba al crear un contacto nuevo: al elegir uno que ya existia, el
        // correo seguia con el nombre de ejemplo del catalogo y nadie se enteraba hasta verlo.
        if (d.contacto_nombre) st.destinatario = d.contacto_nombre;
        st.bloques.entrega.empresa = d.contacto_empresa || '';
        // El enlace que se manda al cliente. Sin esto el correo llevaba a Canva y la apertura
        // no se registraba en ninguna parte.
        st.bloques.entrega.enlace = location.origin + d.enlace;
        save(); touch();
        est.className = 'estado bien';
        est.textContent = 'Guardada (#' + d.id + '). Enlace del cliente: ' + location.origin + d.enlace;
        // Se repinta el panel y se rehace la vista previa en el acto: nadie deberia tener que
        // pulsar F5 para ver lo que acaba de guardar.
        buildPanel(); renderPreview();
      })
      .catch(e => falla(est, e));
  }

  // ── Galeria de paginas ──
  // Subir el PDF (o imagenes), elegir de 2 a 4 en orden y armar el carrusel. La usan la presentacion
  // principal y cada espacio que la acompana (004): el MISMO flujo, cada uno con su estado, sus
  // rutas y lo que hace con el resultado. Devuelve los nodos para colgarlos donde toque.
  //   op.g            estado de esta galeria (galeriaDe(clave))
  //   op.ruta()       '/api/…/paginas', o null si la entrega aun no esta guardada
  //   op.efecto()     efecto actual; op.ponEfecto(v) lo guarda
  //   op.hayCarrusel() si el correo ya lleva un carrusel armado de esta galeria
  //   op.alSubir(d) / op.alArmar(d)  que hacer con la respuesta del servidor
  //   op.claude       accion de «¿Sin el PDF?», si aplica
  function galeria(op) {
    const g = op.g;
    const est = estadoEl('');
    const rejilla = el('div', 'minis');
    const suelta = el('button', 'suelta'); suelta.type = 'button';
    suelta.innerHTML = op.invita || 'Suelta aquí el <b>PDF que descarga Canva</b>, o varias imágenes';
    const fichero = el('input'); fichero.type = 'file';
    fichero.accept = '.pdf,image/*'; fichero.multiple = true; fichero.hidden = true;
    suelta.addEventListener('click', () => fichero.click());
    ['dragover', 'dragenter'].forEach(ev => suelta.addEventListener(ev, e => {
      e.preventDefault(); suelta.classList.add('encima');
    }));
    ['dragleave', 'drop'].forEach(ev => suelta.addEventListener(ev, () => suelta.classList.remove('encima')));
    suelta.addEventListener('drop', e => {
      e.preventDefault();
      if (e.dataTransfer.files && e.dataTransfer.files.length) sube(e.dataTransfer.files);
    });
    fichero.addEventListener('change', () => { if (fichero.files.length) sube(fichero.files); });

    function sube(ficheros) {
      const ruta = op.ruta();
      if (!ruta) {
        est.className = 'estado mal';
        est.textContent = 'Guarda la entrega en el paso 2 antes de subir las páginas.';
        return;
      }
      const lista = Array.prototype.slice.call(ficheros);
      est.className = 'estado';
      est.textContent = 'Leyendo ' + (lista.length === 1 ? lista[0].name : lista.length + ' ficheros') + '…';
      const datos = new FormData();
      lista.forEach(f => datos.append('fichero', f));
      api(ruta, { method: 'POST', body: datos })
        .then(d => {
          g.paginas = d.paginas; g.elegidas = [];
          op.alSubir(d);
          est.className = 'estado';
          est.textContent = d.paginas.length + ' páginas. Elige de 2 a 4, en el orden que quieras.';
          pinta();
        })
        .catch(e => falla(est, e));
    }

    function pinta() {
      rejilla.innerHTML = '';
      g.paginas.forEach(pg => {
        const b = el('button', 'mini'); b.type = 'button';
        const pos = g.elegidas.indexOf(pg.indice);
        b.setAttribute('aria-pressed', String(pos >= 0));
        const img = el('img'); img.src = pg.url; img.alt = pg.rotulo; b.appendChild(img);
        b.appendChild(el('span', 'rot', pg.rotulo));
        if (pos >= 0) b.appendChild(el('span', 'ord', String(pos + 1)));
        if (pg.aviso_precio) {
          const t = el('span', 'precio', 'precio');
          t.title = 'Esta página parece llevar un precio escrito';
          b.appendChild(t);
        }
        b.addEventListener('click', () => {
          const i = g.elegidas.indexOf(pg.indice);
          if (i >= 0) g.elegidas.splice(i, 1);
          else if (g.elegidas.length < 4) g.elegidas.push(pg.indice);
          else { est.className = 'estado mal'; est.textContent = 'Como mucho 4 páginas.'; return; }
          pinta();
          // Con una sola elegida no hay carrusel: el correo sigue ensenando la portada quieta. Si
          // no se dice, parece acabado -y se entrega una imagen fija creyendo que anima.
          if (g.elegidas.length >= 2) arma();
          else {
            est.className = 'estado mal';
            est.textContent = g.elegidas.length
              ? 'Una sola página es una portada quieta. Elige al menos otra para que anime.'
              : 'Sin páginas elegidas el correo lleva la portada quieta. Elige de 2 a 4.';
          }
        });
        rejilla.appendChild(b);
      });
    }

    function arma() {
      est.className = 'estado'; est.textContent = 'Armando el carrusel…';
      api(op.ruta(), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        // El efecto propio de esta galeria. No es el de A-G: alli cada efecto es un GIF ya subido;
        // aqui lo arma el servidor con las paginas del cliente.
        body: JSON.stringify({ indices: g.elegidas, efecto: op.efecto() }),
      }).then(d => {
        op.alArmar(d);
        est.className = 'estado bien';
        est.textContent = 'Carrusel listo con ' + g.elegidas.length + ' páginas.';
      }).catch(e => falla(est, e));
    }

    // El efecto, aqui mismo. Al cambiarlo se rehace el carrusel en el acto, que es lo unico que
    // demuestra que se aplico.
    const efe = el('label', 'fld');
    efe.appendChild(el('span', 'fld-l', 'Efecto del carrusel'));
    const selEfe = el('select');
    M.EFECTOS.forEach(x => {
      const o = el('option', null, x.etiqueta); o.value = x.clave;
      o.title = x.idea;
      if (op.efecto() === x.clave) o.selected = true;
      selEfe.appendChild(o);
    });
    selEfe.addEventListener('change', () => {
      op.ponEfecto(selEfe.value);
      if (g.elegidas.length >= 2) { arma(); return; }
      // Tras recargar la pagina no queda nada en memoria, pero el carrusel YA armado sigue en el
      // correo con el efecto de antes. Decir "guardado" ahi seria la misma mentira que este paso
      // vino a quitar: se enviaria creyendo que se aplico.
      if (op.hayCarrusel()) {
        est.className = 'estado mal';
        est.textContent = 'El carrusel que lleva el correo sigue con el efecto anterior. ' +
          'Vuelve a subir el PDF y elige las páginas para rehacerlo.';
      } else {
        est.className = 'estado';
        est.textContent = 'Efecto guardado. Elige de 2 a 4 páginas y se arma solo.';
      }
    });
    efe.appendChild(selEfe);

    const nodos = [suelta, fichero];
    if (op.claude) {
      const filaC = el('div', 'fila-bt');
      filaC.appendChild(botonEl('¿Sin el PDF? Pedírselo a Claude', null, op.claude));
      nodos.push(filaC);
    }
    nodos.push(est, rejilla, efe, el('p', 'aviso-precio',
      'El aviso de precio solo detecta precios escritos como texto. Si en la presentación el ' +
      'precio es parte de una imagen, no se detecta: míralas antes de entregar.'));
    if (g.paginas.length) pinta();
    return nodos;
  }

  function pideAClaude(enlace) {
    const orden = 'Con el conector de Canva, exporta en JPG a 1200 px de ancho las páginas 1, 2 y 3 ' +
      'de esta presentación y dame los enlaces de descarga: ' + (enlace || '<pega aquí el enlace>');
    navigator.clipboard.writeText(orden).then(
      () => {
        toast('Instrucción copiada. Pégala en Claude.');
        window.open('https://claude.ai/new', '_blank', 'noopener');
      },
      () => toast('No se pudo copiar'));
  }

  // Copiar texto plano, con el mismo respaldo que ya usaban los demas botones. El portapapeles
  // moderno exige que la pagina tenga el foco, y en algunos navegadores ademas permiso; el
  // metodo clasico funciona donde el otro no. Estaba al lado desde el principio y no lo use.
  async function copiaTexto(texto) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(texto);
        return true;
      }
    } catch (e) { /* cae al metodo clasico */ }
    const t = document.createElement("textarea");
    t.value = texto; t.style.cssText = "position:fixed;left:-9999px;top:0;";
    document.body.appendChild(t); t.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    t.remove(); return ok;
  }

  async function copiaWhatsApp() {
    if (faltaEnlaceH()) return;
    const texto = M.renderWhatsApp(prod());
    toast(await copiaTexto(texto)
      ? "WhatsApp copiado · un solo enlace, al principio"
      : "No se pudo copiar");
  }

  function buildPanel() {
    const p = $('#panel'); p.innerHTML = '';
    $('#copyWa').hidden = st.plantilla !== 'H';
    if (st.plantilla === 'H') {
      p.appendChild(buildEntrega());
      const g = el('div', 'grp'); g.appendChild(el('h2', null, 'Espacios que la acompañan'));
      g.appendChild(el('p', 'hint', 'Lo que cambies aquí vale solo para esta entrega: las plantillas A–G ' +
        'y las demás entregas siguen con el catálogo.'));
      M.SERVICIOS.filter(sv => typeof sv.plantillas !== 'string' || sv.plantillas.indexOf('H') >= 0)
        .forEach(sv => g.appendChild(espacioEl(sv)));
      p.appendChild(g);
      const gb = el('div', 'grp'); gb.appendChild(el('h2', null, 'Saludo y firma'));
      BLOQUES.filter(d => ['saludo', 'firma'].indexOf(d.k) >= 0)
        .forEach(d => gb.appendChild(blockEl(d)));
      p.appendChild(gb);
      return;
    }
    p.appendChild(buildPerfil());
    p.appendChild(buildAsuntos());
    p.appendChild(buildEfectos());
    p.appendChild(buildBanco());
    const g1 = el('div', 'grp'); g1.appendChild(el('h2', null, 'Envío'));
    ENVIO.forEach(([k, l, ty]) => g1.appendChild(inputEl(k, l, ty))); p.appendChild(g1);
    const g2 = el('div', 'grp'); g2.appendChild(el('h2', null, 'Bloques del mensaje · interruptor = mostrar / inhibir'));
    BLOQUES.filter(d => !d.soloPara || d.soloPara === M.pick(st))
      .forEach(d => g2.appendChild(blockEl(d))); p.appendChild(g2);
    const r = el('button', 'reset', 'Restablecer todo el contenido'); r.type = 'button';
    r.addEventListener('click', () => { st = M.defaultState(); save(); buildPanel(); buildSeg(); renderPreview(); toast('Contenido restablecido'); });
    p.appendChild(r);
  }
  function buildSeg() {
    const seg = $('#tpl'); seg.innerHTML = '';
    Object.keys(M.TEMPLATES).forEach(k => {
      const b = el('button', null, k + ' · ' + M.TEMPLATES[k].nombre); b.type = 'button'; b.title = M.TEMPLATES[k].desc;
      b.setAttribute('aria-pressed', String(st.plantilla === k));
      // buildPanel tambien: el modo Entrega tiene su propio panel, y hasta ahora todas las
      // plantillas compartian el mismo, asi que nadie lo reconstruia al cambiar de plantilla.
      b.addEventListener('click', () => { st.plantilla = k; buildSeg(); buildPanel(); touch(); });
      seg.appendChild(b);
    });
    const d = el('button', 'dice', '⚄ Aleatoria'); d.type = 'button'; d.title = 'Elige otra plantilla al azar (rotación)';
    d.addEventListener('click', () => { const ks = Object.keys(M.TEMPLATES).filter(k => k !== st.plantilla); st.plantilla = ks[Math.floor(Math.random() * ks.length)]; buildSeg(); buildPanel(); touch(); });
    seg.appendChild(d);
  }

  const prod = () => { const p = JSON.parse(JSON.stringify(st)); p.assetBase = st.assetBaseProd || 'img'; return p; };
  let timer;
  function touch() { save(); clearTimeout(timer); timer = setTimeout(renderPreview, 120); }
  function renderPreview() {
    const key = M.pick(st);
    let html = M.render(st, key);
    // En el compositor autonomo no hay carpeta img/: lo que no venga incrustado hay que
    // pedirlo a produccion, o la vista previa sale con las fotos rotas.
    html = html.replace(/src="img\/([^"]+)"/g, (m, n) => {
      if (window.IMG_DATA && window.IMG_DATA[n]) return 'src="' + window.IMG_DATA[n] + '"';
      if (window.IMG_DATA) return 'src="' + (st.assetBaseProd || '') + '/' + n + '"';
      return m;
    });
    // "Sin imagenes" tiene que ensenar lo que ve de verdad quien las tiene bloqueadas: el TEXTO
    // ALTERNATIVO en el hueco de cada foto. Antes se hacia con `img{display:none}`, que las
    // esconde y esconde tambien el alt: daba por buena una plantilla que con las imagenes
    // bloqueadas se quedaba muda. Quitando el `src` el navegador pinta el alt, que es justo lo
    // que hace Outlook (constitucion, principio III).
    const cuerpo = noImg ? html.replace(/\ssrc="[^"]*"/g, '') : html;
    // Sin Montserrat: el correo no la lleva y Gmail quita los <link>, asi que el cliente ve
    // Trebuchet. Inyectarla solo aqui ensenaba una tipografia que nadie recibe.
    const extra = '<base target="_blank">' +
      (noImg ? '<style>img{border:1px dashed #9895A7!important;min-height:22px}</style>' : '');
    $('#preview').srcdoc = cuerpo.replace('</head>', extra + '</head>');
    $('#meta-tpl').textContent = 'Plantilla ' + key + ' · ' + M.TEMPLATES[key].nombre + ' · ' + M.PERFILES[st.perfil].nombre + ' · ' + (st.imgSet === 'portadas' ? 'portadas Canva' : 'fotos reales');
    $('#meta-size').textContent = Math.round(M.render(prod(), key).length / 1024) + ' KB HTML';
    // El asunto que se manda DE VERDAD: el mismo camino que usa render. Antes ensenaba el del
    // perfil e ignoraba cual de los tres asuntos estaba elegido.
    $('#meta-subj').textContent = M.aplicaAsunto(M.aplicaPerfil(M.normaliza(JSON.parse(JSON.stringify(st))))).asunto;
    marcaLoQueNoSeUsa();
    avisaFechasPasadas();
  }

  // ── Lo que no cambia el correo ──
  // La decision la toma el motor (M.cambiaElCorreo), que es donde se puede probar; aqui solo se
  // pinta. El porque, en render.js.
  function marcaLoQueNoSeUsa() {
    const key = M.pick(st);
    const usa = ruta => M.cambiaElCorreo(st, key, ruta);
    document.querySelectorAll('#panel [data-ruta]').forEach(nodo => {
      // Solo texto e interruptores. Un selector tiene valores cerrados: meterle un testigo lo
      // dejaria en un valor que no existe y la prueba no diria nada util.
      const probable = nodo.classList.contains('sw') || nodo.querySelector('input[type=text], textarea');
      if (!probable) return;
      // Se usa al COPIAR, no al pintar la vista previa: probarlo aqui lo daria por muerto.
      if (nodo.dataset.ruta === 'assetBaseProd') return;
      const no = !usa(nodo.dataset.ruta);
      nodo.classList.toggle('nousa', no);
      // No siempre es la plantilla: tambien el perfil o el asunto elegido deciden que se usa.
      if (no) nodo.title = 'No cambia el correo con la plantilla ' + key + ' y la configuracion actual';
      else nodo.removeAttribute('title');
    });
    // Una linea del catalogo limitada a otras plantillas (003, FR-310): se dice en su cabecera.
    // Sus campos ya salen como «no cambia este correo» por la regla de arriba.
    document.querySelectorAll('#panel .svc[data-servicio]').forEach(w => {
      const linea = M.SERVICIOS.find(x => x.id === w.dataset.servicio);
      w.classList.toggle('fuera', !!linea && typeof linea.plantillas === 'string' && linea.plantillas.indexOf(key) < 0);
    });
    document.querySelectorAll('#panel [data-bloque]').forEach(b => {
      const nodos = Array.from(b.querySelectorAll('[data-ruta]'))
        .filter(n => n.classList.contains('sw') || n.querySelector('input[type=text], textarea'));
      b.classList.toggle('nousa', nodos.length > 0 && nodos.every(n => n.classList.contains('nousa')));
    });
  }

  // ── Datos que caducan ──
  // Los del asesor anuncian trimestres y fechas que pasan. No se corrigen solos -que se vende y
  // cuando es cosa del negocio-, pero el panel lo dice. La decision es del motor (M.fechasPasadas).
  function avisaFechasPasadas() {
    const b = document.querySelector('#panel [data-bloque="asesor"]');
    if (!b) return;
    const avisos = M.fechasPasadas((st.bloques || {}).asesor, new Date());
    b.classList.toggle('caduco', avisos.length > 0);
    if (avisos.length) b.title = 'Fechas vencidas: ' + avisos.join(' · ');
    else b.removeAttribute('title');
  }

  function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms || 1800); }
  // La Personalizada sin enlace mandaria un boton que no lleva a ninguna parte (href="#"):
  // lo vio la auditoria del 2026-10-03. Se avisa y no se copia.
  function faltaEnlaceH() {
    const e = (st.bloques && st.bloques.entrega) || {};
    if (st.plantilla !== 'H' || String(e.enlace || e.url || '').trim()) return false;
    toast('Falta el enlace de la propuesta: el botón no llevaría a ninguna parte. Ponlo en el paso 01.', 5000);
    return true;
  }
  async function copyRich(html, text) {
    try {
      if (navigator.clipboard && window.ClipboardItem) {
        await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })]);
        return true;
      }
    } catch (e) { /* cae al método clásico */ }
    const d = document.createElement('div'); d.contentEditable = 'true'; d.style.cssText = 'position:fixed;left:-9999px;top:0;'; d.innerHTML = html;
    document.body.appendChild(d); const r = document.createRange(); r.selectNodeContents(d);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    sel.removeAllRanges(); d.remove(); return ok;
  }
  $('#copyGmail').addEventListener('click', async () => {
    if (faltaEnlaceH()) return;
    const full = M.render(prod()); const body = (full.match(/<body[^>]*>([\s\S]*)<\/body>/) || [0, full])[1];
    toast((await copyRich(body, M.renderText(prod()))) ? 'Copiado: pega en un correo nuevo de Gmail (Ctrl+V)' : 'No se pudo copiar: el navegador bloqueó el portapapeles');
  });
  $('#copyHtml').addEventListener('click', async () => {
    if (faltaEnlaceH()) return;
    try { await navigator.clipboard.writeText(M.render(prod())); toast('HTML completo copiado'); } catch (e) { toast('No se pudo copiar el HTML'); }
  });
    // El boton de la barra. Estaba puesto y sin conectar: se vaciaba el hueco visual y no hacia
  // nada al pulsarlo. El del paso 05 si funcionaba, asi que el fallo dependia de por donde
  // entrara cada quien.
  $('#copyWa').addEventListener('click', copiaWhatsApp);
  $('#copyText').addEventListener('click', async () => {
    if (faltaEnlaceH()) return;
    try { await navigator.clipboard.writeText(M.renderText(prod())); toast('Versión en texto plano copiada'); } catch (e) { toast('No se pudo copiar el texto'); }
  });
  $('#vDesk').addEventListener('click', () => { $('#stage').classList.remove('mobile'); $('#vDesk').setAttribute('aria-pressed', 'true'); $('#vMob').setAttribute('aria-pressed', 'false'); });
  $('#vMob').addEventListener('click', () => { $('#stage').classList.add('mobile'); $('#vDesk').setAttribute('aria-pressed', 'false'); $('#vMob').setAttribute('aria-pressed', 'true'); });
  $('#vImg').addEventListener('click', () => { noImg = !noImg; $('#vImg').setAttribute('aria-pressed', String(noImg)); renderPreview(); });

  // El logo de la cabecera va escrito como img/logo.jpg, que es lo correcto en local.
  // En el autonomo viene incrustado; en la copia publicada en /static/email/ hay que
  // apuntarlo a la base real, o sale roto -pasaba, y solo se vio al probarlo servido.
  (function () {
    const im = document.querySelector('.brand img');
    if (!im) return;
    if (window.IMG_DATA && window.IMG_DATA['logo.jpg']) { im.src = window.IMG_DATA['logo.jpg']; return; }
    if (window.ASSET_BASE) im.src = String(window.ASSET_BASE).replace(/\/$/, '') + '/logo.jpg';
  })();
  buildPanel(); buildSeg(); renderPreview();

  // Catalogo de lineas de negocio (003). El del servidor manda: se pinta primero con el de serie
  // para no dejar la pantalla vacia y, en cuanto llega, se rehace con el vigente. Las fotos subidas
  // llegan como /media/...; el correo necesita la direccion completa, como en las entregas.
  // Si no llega, se sigue con el de serie y se dice (FR-323).
  if (HAY_SERVIDOR) {
    api('/api/catalogo').then(cat => {
      (cat.lineas || []).forEach(l => { if (/^\/[^/]/.test(l.img || '')) l.img = location.origin + l.img; });
      if (!M.ponCatalogo(cat)) return;
      st = M.normaliza(st); save(); buildPanel(); buildSeg(); renderPreview();
    }).catch(() => toast('No se pudo cargar el catálogo de líneas: se usa el de serie', 5000));
  }
})();
</script>
</body>
</html>
