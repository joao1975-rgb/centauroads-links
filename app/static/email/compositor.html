<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0F0E13">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compositor de Mails Centauro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme:dark;
    --bg:#0F0E13; --card:#1A1921; --hover:#232130; --border:#2D2B3A; --line:#3A3748;
    --text:#EEEDF2; --dim:#9895A7; --faint:#87839A;   /* #6A6778 daba 3,5:1 y hace falta 4,5:1 */
    --purple:#85439A; --purple-l:#A667BD;
    /* borde de los campos: su relleno no los distingue del panel (1,10:1), asi que
       el borde tiene que llegar al 3:1 que pide WCAG 1.4.11. #2D2B3A daba 1,26. */
    --control:#6B6885; --orange:#F79131; --orange-d:#E07A1A;
    --ok:#34D399; --radius:10px;
    --font:'DM Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--text); font:14px/1.45 var(--font); display:flex; flex-direction:column; overflow:hidden; }
  button, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; background:none; border:0; }
  :focus-visible { outline:2px solid var(--orange); outline-offset:2px; }

  /* ── Barra superior ── */
  .bar { display:flex; align-items:center; gap:18px; padding:10px 18px; border-bottom:1px solid var(--border);
         background:linear-gradient(90deg,#1A1524 0%,var(--card) 40%,var(--card) 100%); flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand img { width:30px; height:30px; border-radius:50%; }
  .brand h1 { font-size:15px; font-weight:700; letter-spacing:-.01em; margin:0; }
  .brand .tag { font:500 10px/1 var(--mono); letter-spacing:.14em; color:var(--orange); border:1px solid var(--orange-d); padding:4px 7px; border-radius:20px; }
  .seg { display:flex; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:3px; gap:2px; }
  .seg button { padding:6px 12px; border-radius:6px; color:var(--dim); font-weight:600; font-size:13px; }
  .seg button[aria-pressed="true"] { background:var(--purple); color:#fff; }
  .seg button.dice { color:var(--orange); }
  .seg button:hover:not([aria-pressed="true"]) { background:var(--hover); color:var(--text); }
  .grow { flex:1; }
  .acts { display:flex; gap:8px; }
  /* Equipo y salida: solo con servidor detras, donde hay sesion de la que salir. */
  .menu { display:flex; gap:12px; font-size:12px; }
  .menu a { color:var(--dim); text-underline-offset:3px; }
  .menu a:hover, .menu a:focus-visible { color:var(--text); }
  .btn { padding:8px 14px; border-radius:7px; font-weight:600; font-size:13px; border:1px solid var(--border); background:var(--card); color:var(--text); }
  .btn:hover { background:var(--hover); }
  .btn.primary { background:var(--orange); border-color:var(--orange); color:#141016; }
  .btn.primary:hover { background:var(--orange-d); }

  /* ── Cuerpo ── */
  main { flex:1; display:grid; grid-template-columns:380px 1fr; min-height:0; }
  aside { border-right:1px solid var(--border); overflow-y:auto; background:var(--bg); }
  .grp { padding:14px 16px 6px; }
  .grp h2 { font:600 11px/1 var(--mono); letter-spacing:.16em; color:var(--faint); text-transform:uppercase; margin:0 0 10px; }
  .fld { display:block; margin:0 0 10px; }
  .fld-l { display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  /* Lo que no sale en la plantilla elegida. Atenuado y dicho con palabras: el color solo no
     basta para entender por que escribir ahi no cambia nada. */
  .sw.nousa { opacity:.45; }
  .fld.nousa .fld-l { color:var(--faint); }
  .fld.nousa input, .fld.nousa textarea, .fld.nousa select { border-style:dashed; }
  .fld.nousa .fld-l::after { content:' \00B7  no cambia este correo'; font-style:italic; }
  .blk.nousa .blk-t { color:var(--faint); }
  .blk.nousa > .blk-h::after { content:'no se usa aqu\00ED'; font-size:11px; font-style:italic;
    color:var(--faint); white-space:nowrap; }
  /* Fechas ya pasadas en los datos que caducan. Se ve aunque el bloque este cerrado. */
  .blk.caduco:not(.nousa) > .blk-h::after { content:'fechas vencidas'; font-size:11px; font-weight:600;
    color:var(--orange, #F79131); white-space:nowrap; }
  .aviso-fechas { color:var(--orange, #F79131); font-size:12px; margin:0 0 10px; }
  .fld select { width:100%; background:var(--card); border:1px solid var(--control); border-radius:6px; padding:7px 9px; font-size:13px; color:var(--text); }
  .fld input, .fld textarea { width:100%; background:var(--card); border:1px solid var(--control); border-radius:6px; padding:7px 9px; font-size:13px; line-height:1.4; resize:vertical; }
  .fld input:focus, .fld textarea:focus { border-color:var(--purple-l); outline:none; }
  .hint { font-size:12px; color:var(--orange); margin:0 0 10px; }

  /* Modo Entrega. Los numeros no son adorno: es una secuencia y el orden importa. */
  .paso h2 { display:flex; align-items:baseline; gap:8px; }
  .paso h2 .n { font:700 11px/1 var(--mono); color:var(--purple-l); }
  .paso h2 .n[data-hecho="1"] { color:var(--ok); }
  .suelta { display:block; width:100%; border:1px dashed var(--control); border-radius:var(--radius); padding:20px 14px;
            text-align:center; color:var(--dim); font-size:13px; cursor:pointer;
            background:var(--bg); }
  .suelta:hover, .suelta.encima { border-color:var(--purple-l); color:var(--text); }
  .suelta b { color:var(--text); font-weight:700; }
  .minis { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px;
           margin:10px 0 4px; }
  .mini { position:relative; border:2px solid var(--border); border-radius:8px; overflow:hidden;
          background:var(--card); padding:0; text-align:left; cursor:pointer; }
  .mini img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; }
  .mini .rot { display:block; padding:5px 6px; font-size:11px; line-height:1.3; color:var(--dim);
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mini[aria-pressed="true"] { border-color:var(--purple-l); }
  .mini .ord { position:absolute; top:5px; left:5px; min-width:18px; height:18px; border-radius:9px;
               background:var(--purple); color:#fff; font:700 11px/18px var(--mono);
               text-align:center; }
  .mini .precio { position:absolute; top:5px; right:5px; background:var(--orange); color:#141016;
                  font:700 10px/1 var(--mono); padding:3px 5px; border-radius:4px; }
  .aviso-precio { font-size:12px; color:var(--orange); background:#2A1C10; border-radius:8px;
                  padding:9px 11px; margin:8px 0 0; }
  .fila-bt { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 10px; }
  .estado { font-size:12px; color:var(--dim); margin:0 0 10px; }
  .estado.mal { color:#F4A6B4; }
  .estado.bien { color:var(--ok); }

  /* perfil del destinatario: la decisión que más cambia el mensaje, arriba del todo */
  .pf { display:block; width:100%; text-align:left; border:1px solid var(--border); background:var(--card);
        border-radius:var(--radius); padding:10px 12px; margin:0 0 6px; transition:border-color .12s, background .12s; }
  .pf:hover { background:var(--hover); }
  .pf b { display:block; font-size:13px; font-weight:600; }
  .pf span { display:block; font-size:12px; line-height:1.45; color:var(--dim); margin-top:2px; }
  .pf[aria-pressed="true"] { border-color:var(--purple-l); background:linear-gradient(90deg,rgba(133,67,154,.22),transparent 70%); }
  .pf[aria-pressed="true"] b::before { content:'▸ '; color:var(--orange); }
  /* asuntos: el texto es lo que se va a pegar, asi que manda sobre la etiqueta */
  .asunto { position:relative; }
  .asunto .pf { padding-right:72px; }
  .pf .asunto-t { font-size:15px; font-weight:700; font-style:italic; color:var(--text);
                  line-height:1.35; margin-top:4px; }
  .asunto-c { position:absolute; top:9px; right:9px; font:600 11px/1 var(--mono);
              color:var(--orange); background:var(--bg); border:1px solid var(--control);
              border-radius:6px; padding:6px 9px; }
  .asunto-c:hover { background:var(--hover); color:var(--text); }

  .row { display:flex; align-items:center; gap:10px; padding:10px 2px 2px; }
  .row-t { flex:1; font-size:13px; }
  .row-t i { display:block; font-style:normal; font-size:12px; color:var(--dim); }

  /* banco de imagenes: la foto apagada es la que NO entra, para que se vea de un vistazo */
  .bk { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:0 0 10px; }
  .bk button { border:1px solid var(--border); border-radius:6px; overflow:hidden;
               background:var(--card); padding:0; text-align:left; }
  .bk img { display:block; width:100%; height:54px; object-fit:cover; opacity:.35; transition:opacity .12s; }
  .bk button[aria-pressed="true"] { border-color:var(--purple-l); }
  .bk button[aria-pressed="true"] img { opacity:1; }
  .bk i { display:block; font:10px/1.3 var(--mono); font-style:normal; padding:3px 5px;
          color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bk button[aria-pressed="true"] i { color:var(--text); }
  .aviso { font-size:12px; line-height:1.45; color:#F7C69B; background:rgba(247,145,49,.10);
           border:1px solid rgba(247,145,49,.38); border-radius:6px; padding:7px 9px; margin:0 0 10px; }
  .cmd { font:11px/1.5 var(--mono); color:var(--dim); background:var(--bg); border:1px solid var(--border);
         border-radius:6px; padding:6px 8px; margin:0 0 4px; word-break:break-all; }

  .blk { border:1px solid var(--border); border-radius:var(--radius); background:var(--card); margin:0 0 8px; overflow:hidden; }
  .blk-h { display:flex; align-items:center; gap:10px; padding:9px 12px; }
  .blk-t { flex:1; text-align:left; font-weight:600; font-size:13px; padding:2px 0; display:flex; justify-content:space-between; align-items:center; }
  .blk-t::after { content:'›'; color:var(--faint); font-size:16px; transform:rotate(90deg); transition:transform .15s; }
  .blk.open .blk-t::after { transform:rotate(-90deg); }
  .blk-b { display:none; padding:4px 12px 8px; border-top:1px solid var(--border); }
  .blk.open .blk-b { display:block; }
  .blk.off { opacity:.55; }
  .blk.off .blk-t { text-decoration:line-through; text-decoration-color:var(--faint); }

  .svc { border-left:2px solid var(--line); margin:8px 0 8px 4px; padding-left:10px; }
  .svc-h { display:flex; align-items:center; gap:8px; }
  .marca-espacio { font-size:11px; color:var(--faint); white-space:nowrap; }
  .marca-espacio.propia { color:var(--purple-l); font-weight:700; }
  .svc-t { flex:1; text-align:left; font-size:13px; padding:4px 0; color:var(--text); }
  .svc-b { display:none; padding-top:6px; }
  .svc.open .svc-b { display:block; }
  .svc.off .svc-t { color:var(--faint); text-decoration:line-through; }
  .svc.fuera .svc-t { color:var(--faint); }
  .svc.fuera .svc-t::after { content:' \00B7  no se usa en esta plantilla'; font-size:11px; font-style:italic; }

  /* interruptor */
  .sw { position:relative; width:34px; height:20px; flex:none; }
  .sw input { position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; }
  .sw-k { position:absolute; inset:0; background:var(--line); border-radius:20px; transition:background .15s; }
  .sw-k::after { content:''; position:absolute; top:3px; left:3px; width:14px; height:14px; border-radius:50%; background:#fff; transition:transform .15s; }
  .sw input:checked + .sw-k { background:var(--orange); }
  .sw input:checked + .sw-k::after { transform:translateX(14px); }
  .sw input:focus-visible + .sw-k { outline:2px solid var(--orange); outline-offset:2px; }

  .reset { margin:6px 16px 20px; font-size:12px; color:var(--dim); text-decoration:underline; }

  /* ── Escenario de vista previa ── */
  #stage { display:flex; flex-direction:column; min-height:0; background:radial-gradient(1200px 600px at 70% -10%,rgba(133,67,154,.18),transparent 60%),radial-gradient(800px 400px at 0% 100%,rgba(247,145,49,.10),transparent 60%),var(--bg); }
  .stage-top { display:flex; align-items:center; gap:14px; padding:10px 18px; font-size:12px; color:var(--dim); border-bottom:1px solid var(--border); }
  .stage-top .seg { margin-left:auto; }
  .stage-top .seg button { padding:5px 10px; font-size:12px; }
  .stage-top .seg button[aria-pressed="true"] { background:var(--hover); color:var(--text); }
  .subj { color:var(--text); font-weight:600; }
  .meta { font:500 11px var(--mono); color:var(--faint); }
  .frame-wrap { flex:1; overflow:auto; display:flex; justify-content:center; padding:22px; }
  .frame { width:640px; max-width:100%; height:100%; background:#fff; border-radius:8px; box-shadow:0 30px 60px -20px rgba(0,0,0,.7),0 0 0 1px var(--border); overflow:hidden; transition:width .2s; }
  #stage.mobile .frame { width:375px; }
  iframe { width:100%; height:100%; border:0; display:block; background:#fff; }

  .toast { position:fixed; left:50%; bottom:22px; transform:translate(-50%,20px); background:var(--card); border:1px solid var(--ok); color:var(--text); padding:9px 16px; border-radius:8px; font-size:13px; opacity:0; transition:.2s; pointer-events:none; }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  @media (max-width:900px) { main { grid-template-columns:1fr; } aside { max-height:45vh; border-right:0; border-bottom:1px solid var(--border); } }
  /* En pantallas estrechas la pagina se desplaza y la barra de plantillas se parte en filas:
     antes medía 746 px fijos y E-H quedaban fuera, sin forma de tocarlas (auditoria 2026-10-03). */
  #tpl { flex-wrap:wrap; }
  @media (max-width:900px) { html, body { height:auto; } body { overflow:auto; } main { min-height:92vh; } }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><img src="img/logo.jpg" alt="" width="30" height="30"><h1>Compositor de mails</h1><span class="tag">PROTOTIPO</span>
    <nav class="menu" id="menu" aria-label="Panel" hidden>
      <a href="/panel/lineas">Líneas de negocio</a>
      <a href="/panel/equipo">Equipo</a>
      <a href="/panel/salir">Salir</a>
    </nav></div>
  <div class="seg" id="tpl" role="group" aria-label="Plantilla"></div>
  <div class="grow"></div>
  <div class="acts">
    <button class="btn" id="copyText" type="button">Copiar texto</button>
    <button class="btn" id="copyHtml" type="button">Copiar HTML</button>
    <button class="btn" id="copyWa" type="button" hidden>Copiar para WhatsApp</button>
    <button class="btn primary" id="copyGmail" type="button">Copiar para pegar en Gmail</button>
  </div>
</header>
<main>
  <aside id="panel"></aside>
  <section id="stage">
    <div class="stage-top">
      <span class="subj" id="meta-subj"></span>
      <span class="meta" id="meta-tpl"></span>
      <span class="meta" id="meta-size"></span>
      <div class="seg">
        <button type="button" id="vDesk" aria-pressed="true">Escritorio</button>
        <button type="button" id="vMob" aria-pressed="false">Móvil</button>
        <button type="button" id="vImg" aria-pressed="false">Sin imágenes</button>
      </div>
    </div>
    <div class="frame-wrap"><div class="frame"><iframe id="preview" title="Vista previa del correo"></iframe></div></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';
  const M = window.CentauroMail;
  // La clave incluye la version de contenido de render.js: si cambian los valores por defecto, lo guardado
  // en el navegador con datos viejos se ignora (evita que reaparezcan telefono/web/correo antiguos).
  const KEY = 'centauro-mail-proto-c' + (M.CONTENT_VERSION || 0);
  try { Object.keys(localStorage).filter(k => k.indexOf('centauro-mail-proto-') === 0 && k !== KEY).forEach(k => localStorage.removeItem(k)); } catch (e) { /* sin almacenamiento */ }
  // Segunda red: aunque la version coincida, lo guardado puede arrastrar datos de contacto YA RETIRADOS
  // (paso por aqui porque al usuario le reaparecieron el telefono y la web viejos). Si aparece cualquiera de
  // estos valores, el contenido guardado se descarta entero y se cargan los valores por defecto actuales.
  const RETIRADOS = ['412 000 0000', '412 1003559', 'www.centauroads.com', 'contacto@centauroads', 'publicitarios OOH + DOOH'];
  // Ademas: si lo guardado no trae el slogan (contenido anterior al bloque de marca), tambien se descarta.
  try { const r0 = localStorage.getItem(KEY); if (r0 && r0.indexOf('\"slogan\"') < 0) { localStorage.removeItem(KEY); } } catch (e) { /* sin almacenamiento */ }
  try {
    const raw = localStorage.getItem(KEY);
    if (raw && RETIRADOS.some(v => raw.indexOf(v) >= 0)) { localStorage.removeItem(KEY); }
  } catch (e) { /* sin almacenamiento */ }
  const $ = s => document.querySelector(s);
  const get = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
  const set = (o, p, v) => { const ks = p.split('.'); const last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function load() { try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* sin almacenamiento: seguimos en memoria */ } }
  // Normalizar al cargar: el panel se construye antes del primer render, y sin esto
  // un servicio retirado (Paradas) seguiria apareciendo en sus editores.
  let st = M.normaliza(load() || M.defaultState());
  let noImg = false;

  const ENVIO = [
    ['asunto', 'Asunto'],
    ['preheader', 'Preheader (texto de vista previa en la bandeja)', 'textarea'],
    ['destinatario', 'Destinatario (rellena {destinatario})'],
    ['imgSet', 'Imágenes de los servicios', 'select'],
    ['assetBaseProd', 'URL pública de las imágenes (se usa al copiar)'],
    // Ya no hay "base de links cortos": cada servicio lleva su propio enlace, en su ficha.
    ['token', 'Token por destinatario (?c=) · solo en enlaces cortos de Centauro'],
  ];
  const BLOQUES = [
    { k: 'hero', label: 'Foto de cabecera (solo D)', hint: 'Archivo de img/. Solo la usa la plantilla D Cartelera móvil.',
      f: [['img', 'Foto real'], ['imgPortada', 'Portada Canva (cuando se elige ese juego)'], ['alt', 'Texto alternativo']] },
    { k: 'saludo', label: 'Saludo', f: [['texto', 'Texto', 'textarea']] },
    { k: 'intro', label: 'Introducción', f: [['texto', 'Párrafo', 'textarea']] },
    { k: 'titulo', label: 'Título de sección', f: [['texto', 'Título'], ['sub', 'Subtítulo']] },
    { k: 'servicios', label: 'Servicios (catálogo)', servicios: true },
    { k: 'asesor', label: 'Datos del formato del asesor', sinInterruptor: true,
      hint: 'Estos datos CADUCAN. Revisalos antes de cada envio: una disponibilidad vieja o una fecha pasada se notan.',
      f: [['periodo', 'Periodo que se anuncia'], ['etiquetaMeta', 'Etiqueta de la cabecera'],
          ['dispoFecha', 'Disponibilidad actualizada al'], ['dispoTexto', 'Que hay disponible'],
          ['cierreTexto', 'Fecha de cierre'], ['slotsLed', 'Distintivo del LED (ej. 3 SLOTS)'],
          ['botonTexto', 'Texto del boton (plantilla E)'], ['pieCta', 'Linea bajo el boton'], ['respuesta', 'Compromiso de respuesta']] },
    // Los textos de E, F y G. Eran literales en el codigo; ahora son datos. Cada bloque sale solo
    // con su plantilla elegida (soloPara): en las demas no cambian nada.
    { k: 'inventario', soloPara: 'E', sinInterruptor: true, label: 'Textos de la plantilla E',
      hint: 'Escribe *así* para resaltar una palabra (en los titulares sale en color; en los párrafos, en negrita). Enter = salto de línea. Huecos: {periodo}, {frentes} (en letras), {n} (en cifra), {destinatario}.',
      f: [['epigrafe', 'Epígrafe sobre el titular'], ['titulo', 'Titular', 'textarea'], ['entrada', 'Entrada', 'textarea'],
          ['saludoEpigrafe', 'Epígrafe del saludo'], ['saludo1', 'Saludo · primer párrafo', 'textarea'],
          ['saludo2', 'Saludo · segundo párrafo', 'textarea'],
          ['cifra1', 'Cifra 1'], ['etiqueta1', 'Cifra 1 · etiqueta'], ['cifra2', 'Cifra 2'], ['etiqueta2', 'Cifra 2 · etiqueta'],
          ['cifra3', 'Cifra 3'], ['etiqueta3', 'Cifra 3 · etiqueta'],
          ['seccion', 'Epígrafe de la tabla'], ['seccionTitulo', 'Título de la tabla'], ['seccionSub', 'Subtítulo de la tabla'],
          ['pieFoto', 'Pie de la foto del LED'], ['dispoEtiqueta', 'Texto antes de la fecha de disponibilidad']] },
    { k: 'tablaInventario', soloPara: 'E', sinInterruptor: true, label: 'Tabla de inventario (plantilla E)',
      hint: 'Una fila por espacio; solo salen los espacios encendidos. {medida} la pone la ficha oficial: no la escribas a mano.',

  function inputEl(path, label, type, onInput) {
    const wrap = el('label', 'fld'); wrap.appendChild(el('span', 'fld-l', label));
    wrap.dataset.ruta = path;
    // 'opciones': selector de catalogo, con el mapa clave->etiqueta en el 4o argumento.
    // El 'select' de abajo esta clavado a M.IMG_SETS y no vale para nada mas.
    if (type === 'opciones') {
      const sel = document.createElement('select');
      Object.entries(onInput).forEach(([k, l]) => { const o = el('option', null, l); o.value = k; sel.appendChild(o); });
      sel.value = get(st, path) || Object.keys(onInput)[0];
      sel.addEventListener('change', () => { set(st, path, sel.value); touch(); });
      wrap.appendChild(sel); return wrap;
    }
    if (type === 'select') {
      const sel = document.createElement('select');
      Object.entries(M.IMG_SETS).forEach(([k, l]) => { const o = el('option', null, l); o.value = k; sel.appendChild(o); });
      sel.value = get(st, path) || 'fotos';
      sel.addEventListener('change', () => { set(st, path, sel.value); touch(); });
      wrap.appendChild(sel); return wrap;
    }
    const ta = type === 'textarea' || type === 'lines';
    const inp = document.createElement(ta ? 'textarea' : 'input'); if (!ta) inp.type = 'text'; else inp.rows = 3;
    const v = get(st, path); inp.value = type === 'lines' ? (Array.isArray(v) ? v.join('\n') : (v || '')) : (v == null ? '' : v);
    inp.addEventListener('input', () => { set(st, path, type === 'lines' ? inp.value.split('\n') : inp.value); if (typeof onInput === 'function') onInput(inp.value); touch(); });
    wrap.appendChild(inp); return wrap;
  }
  // Un interruptor como campo de un bloque, con su explicacion al lado: la misma fila que el
  // "Tema oscuro" del perfil.
  function filaInterruptor(path, etiqueta, ayuda) {
    const r = el('div', 'row'); r.appendChild(switchEl(path, () => {}, etiqueta));
    const t = el('div', 'row-t'); t.appendChild(document.createTextNode(etiqueta));
    if (ayuda) t.appendChild(el('i', null, ayuda));
    r.appendChild(t); return r;
  }
  // Un titulo que abre y cierra su seccion, y lo anuncia (aria-expanded).
  function plegable(boton, caja) {
    const di = () => boton.setAttribute('aria-expanded', String(caja.classList.contains('open')));
    di(); boton.addEventListener('click', () => { caja.classList.toggle('open'); di(); });
  }
  function switchEl(path, onChange, nombre) {
    const l = el('label', 'sw'); const c = document.createElement('input'); c.type = 'checkbox'; c.checked = !!get(st, path);
    l.dataset.ruta = path;
    c.setAttribute('aria-label', nombre ? 'Mostrar ' + nombre : 'Mostrar u ocultar');
    c.addEventListener('change', () => { set(st, path, c.checked); onChange(c.checked); touch(); });
    l.appendChild(c); l.appendChild(el('i', 'sw-k')); return l;
  }
  // ── Un espacio que acompana la entrega (004) ──
  // Todo lo que se cambia aqui va a bloques.entrega -incluidos y espacios- y al servidor, con la
  // entrega. st.servicios, que es de las plantillas A-G, no se toca: un enlace o un carrusel pensado
  // para un cliente no puede colarse en un correo de catalogo ni en la entrega de otro cliente.
  // `sv` es la linea del catalogo: sus valores son el estandar y salen de placeholder.
  function espacioEl(sv) {
    const E = st.bloques.entrega;
    if (!Array.isArray(E.incluidos)) E.incluidos = [];
    if (!E.espacios) E.espacios = {};
    const propio = () => E.espacios[sv.id] || {};
    const incluido = () => E.incluidos.indexOf(sv.id) >= 0;
    const w = el('div', 'svc'); w.dataset.servicio = sv.id; w.classList.toggle('off', !incluido());

    const h = el('div', 'svc-h');
    const sw = el('label', 'sw'); const c = document.createElement('input'); c.type = 'checkbox';
    c.checked = incluido(); c.setAttribute('aria-label', 'Incluir ' + sv.nombre + ' en esta entrega');
    c.addEventListener('change', () => {
      E.incluidos = c.checked ? E.incluidos.concat(sv.id) : E.incluidos.filter(x => x !== sv.id);
      w.classList.toggle('off', !c.checked); save(); touch();
    });
    sw.appendChild(c); sw.appendChild(el('i', 'sw-k')); h.appendChild(sw);
    const t = el('button', 'svc-t', propio().nombre || sv.nombre); t.type = 'button'; plegable(t, w);
    h.appendChild(t);
    // Estandar o personalizado, y que tiene de propio: sin esto, con varios espacios nadie sabe
    // cual lleva que antes de copiar el correo al cliente.
    const marca = el('span', 'marca-espacio');
    const pintaMarca = () => {
      const pr = propio(), lista = [];
      if (pr.canva) lista.push('enlace');
      if (pr.carrusel) lista.push('imágenes');
      if (pr.nombre || pr.cobertura) lista.push('textos');
      marca.textContent = lista.length ? 'Personalizado: ' + lista.join(', ') : 'Estándar';
      marca.classList.toggle('propia', lista.length > 0);
    };
    pintaMarca(); h.appendChild(marca); w.appendChild(h);

    const b = el('div', 'svc-b');
    const est = estadoEl('');
    const esperas = {};
    // Lo que el servidor guarda de este espacio. Vacio o igual al catalogo = estandar (lo decide
    // el servidor contra el catalogo; aqui se hace lo mismo para que el correo cambie en el acto).
    const guarda = (k, v) => {
      if (!st.entregaId) {
        est.className = 'estado';
        est.textContent = 'Se guardará con la entrega: guárdala en el paso 2.';
        return;
      }
      const cuerpo = {}; cuerpo[k === 'canva' ? 'canva_url' : k] = v;
      api('/api/entregas/' + st.entregaId + '/espacios/' + encodeURIComponent(sv.id), {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cuerpo),
      }).then(() => { est.className = 'estado bien'; est.textContent = 'Guardado en esta entrega.'; })
        .catch(e => falla(est, e));
    };
    const pon = (k, v) => {
      const pr = Object.assign({}, propio());
      if (!v || v === (sv[k] || '')) delete pr[k]; else pr[k] = v;
      if (Object.keys(pr).length) E.espacios[sv.id] = pr; else delete E.espacios[sv.id];
      save(); touch(); pintaMarca();
      clearTimeout(esperas[k]); esperas[k] = setTimeout(() => guarda(k, v), 700);
    };
    const campo = (k, etiqueta) => {
      const wrap = el('label', 'fld'); wrap.appendChild(el('span', 'fld-l', etiqueta));
      const i = el('input'); i.type = 'text'; i.value = propio()[k] || ''; i.placeholder = sv[k] || '';
      i.addEventListener('input', () => {
        pon(k, i.value.trim());
        if (k === 'nombre') t.textContent = i.value.trim() || sv.nombre;
      });
      wrap.appendChild(i); return wrap;
    };
    b.appendChild(campo('canva', 'Enlace de su presentación (vacío = el del catálogo)'));
    b.appendChild(campo('nombre', 'Nombre (vacío = el del catálogo)'));
    b.appendChild(campo('cobertura', 'Cobertura / ubicación (vacío = la del catálogo)'));

    // Sus imagenes: la misma galeria que la presentacion principal, con sus propias rutas.
    const ponCarrusel = url => {
      E.espacios[sv.id] = Object.assign({}, propio(), { carrusel: url });
      save(); touch(); pintaMarca();
    };
    b.appendChild(el('p', 'fld-l', 'Imágenes de su presentación'));
    galeria({
      g: galeriaDe('espacio:' + sv.id),
      ruta: () => st.entregaId
        ? '/api/entregas/' + st.entregaId + '/espacios/' + encodeURIComponent(sv.id) + '/paginas' : null,
      efecto: () => galeriaDe('espacio:' + sv.id).efecto || st.efectoEntrega || 'barrido',
      ponEfecto: v => { galeriaDe('espacio:' + sv.id).efecto = v; },
      hayCarrusel: () => !!propio().carrusel,
      alSubir: d => { if (d.paginas.length) ponCarrusel(location.origin + d.paginas[0].url); },
      alArmar: d => {
        const x = (d.espacios || []).filter(z => z.linea === sv.id)[0];
        if (x && x.carrusel) ponCarrusel(location.origin + x.carrusel);
      },
      claude: () => pideAClaude(propio().canva || sv.canva),
      invita: 'Suelta aquí el <b>PDF de la presentación de este espacio</b>, o varias imágenes',
    }).forEach(n => b.appendChild(n));

    const fila = el('div', 'fila-bt');
    fila.appendChild(botonEl('Volver al estándar', null, () => {
      delete E.espacios[sv.id]; save(); touch();
      if (st.entregaId) {
        api('/api/entregas/' + st.entregaId + '/espacios/' + encodeURIComponent(sv.id), { method: 'DELETE' })
          .catch(e => falla(est, e));
      }
      buildPanel();
    }));
    b.appendChild(fila); b.appendChild(est);
    w.appendChild(b); return w;
  }

  function servicioEl(s, i) {
    const w = el('div', 'svc'); w.classList.toggle('off', !s.on); w.dataset.servicio = s.id;
    const h = el('div', 'svc-h'); h.appendChild(switchEl('servicios.' + i + '.on', on => w.classList.toggle('off', !on), s.nombre));
    const t = el('button', 'svc-t', s.nombre); t.type = 'button'; plegable(t, w); h.appendChild(t); w.appendChild(h);
    const b = el('div', 'svc-b');
    b.appendChild(inputEl('servicios.' + i + '.nombre', 'Nombre', null, v => { t.textContent = v; }));

    // El enlace de la presentación. Vale otro de Canva o uno corto del acortador propio. Debajo
    // se dice qué enlace sale DE VERDAD en el correo —con el token, si lo lleva—: sin eso no hay
    // forma de saber si lo escrito llega, y ya pasó que un enlace sin https:// acababa en un 404.
    const sale = el('p', 'hint');
    const avisa = v => {
      const url = String(v || '').trim();
      if (!/^https?:\/\//i.test(url)) {
        sale.textContent = 'Tiene que empezar por https:// — sin eso el enlace no abre.';
        sale.style.color = 'var(--danger, #E8836F)';
        return;
      }
      const dom = /^https?:\/\/links\.centauroads\.com\//i.test(url) ? ' · enlace corto de Centauro' :
                  /canva\.(link|com|site)/i.test(url) ? ' · Canva' : ' · otro sitio';
      sale.textContent = 'Sale en el correo: ' + M.linkFor(st, Object.assign({}, s, { canva: url })) + dom;
      sale.style.color = '';
    };
    b.appendChild(inputEl('servicios.' + i + '.canva', 'Enlace de la presentación', null, avisa));
    b.appendChild(sale);
    avisa(s.canva);
    b.appendChild(inputEl('servicios.' + i + '.cobertura', 'Cobertura / ubicación'));
    b.appendChild(inputEl('servicios.' + i + '.nota', 'Nota (opcional)'));
    b.appendChild(inputEl('servicios.' + i + '.cta', 'Texto del botón (plantilla D)'));
    w.appendChild(b); return w;
  }
  function blockEl(def) {
    const b = el('section', 'blk'); b.dataset.bloque = def.k;
    // Un bloque de DATOS -no una seccion del correo- no lleva interruptor: no hay nada que
    // mostrar u ocultar. El del asesor tenia uno y no cambiaba nada en ninguna plantilla.
    if (!def.sinInterruptor) b.classList.toggle('off', !get(st, 'bloques.' + def.k + '.on'));
    const head = el('header', 'blk-h');
    if (!def.sinInterruptor) head.appendChild(switchEl('bloques.' + def.k + '.on', on => b.classList.toggle('off', !on), def.label));
    const t = el('button', 'blk-t', def.label); t.type = 'button'; plegable(t, b);
    head.appendChild(t); b.appendChild(head);
    const body = el('div', 'blk-b');
    if (def.hint) body.appendChild(el('p', 'hint', def.hint));
    if (def.servicios) st.servicios.forEach((s, i) => body.appendChild(servicioEl(s, i)));
    else def.f.forEach(([k, l, ty, op]) => body.appendChild(ty === 'interruptor'
      ? filaInterruptor('bloques.' + def.k + '.' + k, l, op)
      : inputEl('bloques.' + def.k + '.' + k, l, ty, op)));
    b.appendChild(body); return b;
  }
  // Perfil del destinatario: reescribe asunto, textos y orden de servicios, y añade su bloque propio.
  function buildPerfil() {
    const g = el('div', 'grp'); g.appendChild(el('h2', null, 'Perfil del destinatario'));
    const btns = [];
    Object.entries(M.PERFILES).forEach(([k, pf]) => {
      const b = el('button', 'pf'); b.type = 'button';
      b.appendChild(el('b', null, pf.nombre)); b.appendChild(el('span', null, pf.desc));
      b.setAttribute('aria-pressed', String(st.perfil === k));
      b.addEventListener('click', () => {
        st.perfil = k;
        buildPanel();
        btns.forEach(([bb, kk]) => bb.setAttribute('aria-pressed', String(kk === k)));
        touch();
      });
      btns.push([b, k]); g.appendChild(b);
    });
    g.appendChild(el('p', 'hint', 'El perfil reescribe asunto, título, introducción, cierre y botón sobre la marcha: los campos de abajo siguen intactos y son los que se usan en el perfil General.'));
    // Claro u oscuro. Solo afecta a los formatos del asesor (E, F, G): los mios llevan
    // su tema fijo por diseno.
    const tema = el('div', 'row');

    tc.checked = st.tema === 'oscuro'; tc.setAttribute('aria-label', 'Tema oscuro');

    ts.appendChild(tc); ts.appendChild(el('i', 'sw-k'));

    tt.appendChild(el('i', null, 'Solo cambia los formatos del asesor: E, F y G.'));

    const r = el('div', 'row');
    const sw = el('label', 'sw'); const c = document.createElement('input'); c.type = 'checkbox';
    c.checked = st.precios === 'desde'; c.setAttribute('aria-label', 'Mostrar precios desde');
    c.addEventListener('change', () => { st.precios = c.checked ? 'desde' : 'no'; touch(); });
    sw.appendChild(c); sw.appendChild(el('i', 'sw-k'));

    t.appendChild(el('i', null, 'Apagado: ningún importe. Encendido: precio de entrada por espacio.'));
    r.appendChild(sw); r.appendChild(t); g.appendChild(r);
    return g;
