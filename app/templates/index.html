<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicativo Acortar Links | Centauro ADS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #85439A;
            --purple-dark: #6B3580;
            --purple-light: #A667BD;
            --orange: #F79131;
            --bg: #0F0E13;
            --text: #EEEDF2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.45;
            z-index: -1;
            animation: pulse 8s infinite alternate ease-in-out;
        }
        .glow.purple {
            background: var(--purple-light);
            width: 500px;
            height: 500px;
            top: -150px;
            left: -100px;
        }
        .glow.orange {
            background: var(--orange);
            width: 400px;
            height: 400px;
            bottom: -150px;
            right: -50px;
            animation-delay: -4s;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(30px, -30px); }
        }

        .container {
            background: rgba(26, 25, 33, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 4rem 3rem;
            text-align: center;
            max-width: 650px;
            width: 90%;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .badge {
            display: inline-block;
            background: rgba(247, 145, 49, 0.15);
            color: var(--orange);
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(247, 145, 49, 0.3);
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 0.75rem;
        }
        h1 span {
            background: linear-gradient(135deg, var(--purple-light), var(--orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2.5rem;
            line-height: 1.5;
            max-width: 480px;
            margin-inline: auto;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--purple), var(--orange));
            color: white;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 1rem 2.5rem;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 25px rgba(133, 67, 154, 0.4);
        }

        .btn-primary:active {
            transform: translateY(1px);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.25rem; }
            .container { padding: 3rem 1.5rem; }
        }
    
        .super-admin-btn {
            background: transparent;
            border: 1px solid rgba(255,180,0,0.3);
            color: rgba(255,180,0,0.8);
            margin-top: 1.5rem;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .super-admin-btn:hover {
            background: rgba(255,180,0,0.1);
            color: #FFB366;
        }

        /* Modal Base */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-content {
            background: rgba(25,25,35,0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: left;
        }
        .modal-content h3 {
            margin-top: 0;
            color: #fff;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-content .close-btn {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .modal-content label {
            display: block;
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            margin-top: 1rem;
        }
        .modal-content input {
            width: 100%;
            margin-bottom: 0;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }
        .modal-content input:focus {
            border-color: rgba(255,180,0,0.5);
            background: rgba(255,255,255,0.1);
        }
        .modal-content .btn-primary {
            width: 100%;
            margin-top: 1.5rem;
        }
</style>

</head>
<body>

    <div class="glow purple"></div>
    <div class="glow orange"></div>

    <div class="container">
        <div class="badge">Herramienta Interna</div>
        
<div style="text-align: center; margin-bottom: 20px;">
    <img src="/static/logo.jpg" alt="Centauro ADS" style="height: 100px; border-radius: 50%; box-shadow: 0 4px 15px rgba(255, 179, 102, 0.4);">
</div>
<h1>Aplicativo <br><span>Acortar Links</span></h1>

        <p>Sistema corporativo de <strong>Centauro ADS</strong> para la gestión y configuración de enlaces acortados.</p>
        
        
        <div class="auth-box" style="margin-top: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 1rem;">
            <p id="errorMsg" style="color: #F87171; font-weight: 600; display: none; margin:0; font-size: 0.9rem;">Contraseña incorrecta</p>
            <input type="password" id="adminKey" placeholder="Ingresa la clave de acceso corporativa..." 
                   style="width: 100%; max-width: 320px; padding: 0.8rem 1.2rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.4); color: white; font-size: 1rem; text-align: center; outline: none; font-family: 'DM Sans', sans-serif;">
            
            <button onclick="login()" class="btn-primary" style="width: 100%; max-width: 320px;">
                Ingresar al Sistema
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
            <button class="super-admin-btn" onclick="document.getElementById('modalLogin').style.display='flex'">
                <span style="margin-right:5px">🔧</span> Sugerir Cambio de Clave
            </button>
        </div>

        <script>
            if (window.location.search.includes('error=1')) {
                document.getElementById('errorMsg').style.display = 'block';
            }

            function login() {
                const key = document.getElementById('adminKey').value.trim();
                if (key) {
                    localStorage.setItem('centauroads_admin_key', key);
                    window.location.href = '/admin';
                }
            }

            // Auto-login on enter
            document.getElementById('adminKey').addEventListener('keydown', e => {
                if (e.key === 'Enter') login();
            });
        </script>

    </div>


    <!-- Modal 1: Login Super Admin -->
    <div class="modal-overlay" id="modalLogin">
        <div class="modal-content">
            <h3>Seguridad Máster <button class="close-btn" onclick="closeModals()">&times;</button></h3>
            <label>Usuario Autorizado</label>
            <input type="email" id="saUser" placeholder="centauroadss@gmail.com">
            
            <label>Contraseña Máster</label>
            <input type="password" id="saPass" placeholder="••••••••">
            
            <button class="btn-primary" onclick="authSuperAdmin()" id="btnSaLogin">Verificar Identidad</button>
        </div>
    </div>

    <!-- Modal 2: Change Password -->
    <div class="modal-overlay" id="modalChange">
        <div class="modal-content">
            <h3>Generar Nueva Clave <button class="close-btn" onclick="closeModals()">&times;</button></h3>
            <label>Clave Operativa Actual</label>
            <input type="text" id="saCurrent" disabled style="background: rgba(0,0,0,0.5); color:#888;">
            
            <label>Nueva Clave de Acceso</label>
            <div style="position:relative; width: 100%;">
                <input type="password" id="saNew" placeholder="Ingresa la nueva clave" style="padding-right: 40px;">
                <span onclick="togglePwd('saNew', this)" style="position:absolute; right:12px; top:12px; cursor:pointer;" title="Ver Clave">👁️</span>
            </div>

            <label>Confirmar Nueva Clave</label>
            <div style="position:relative; width: 100%;">
                <input type="password" id="saNew2" placeholder="Repite la clave" style="padding-right: 40px;">
                <span onclick="togglePwd('saNew2', this)" style="position:absolute; right:12px; top:12px; cursor:pointer;" title="Ver Clave">👁️</span>
            </div>
            
            <button class="btn-primary" onclick="changeAdminPass()" id="btnSaChange" style="background: linear-gradient(135deg, #FFB366 0%, #F79131 100%);">Actualizar Clave</button>
        </div>
    </div>

    <script>
        function closeModals() {
            document.getElementById('modalLogin').style.display = 'none';
            document.getElementById('modalChange').style.display = 'none';
            document.getElementById('saUser').value = '';
            document.getElementById('saPass').value = '';
            document.getElementById('saNew').value = '';
            document.getElementById('saNew2').value = '';
        }

        async function authSuperAdmin() {
            const user = document.getElementById('saUser').value.trim();
            const pass = document.getElementById('saPass').value.trim();
            const btn = document.getElementById('btnSaLogin');
            btn.disabled = true; btn.textContent = 'Verificando...';

            try {
                const res = await fetch('/api/superadmin/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user: user, password: pass})
                });
                const data = await res.json();
                
                if (res.ok) {
                    document.getElementById('mod        function togglePwd(id, icon) {
            const input = document.getElementById(id);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = '🙈';
            } else {
                input.type = 'password';
                icon.innerText = '👁️';
            }
        }

alLogin').style.display = 'none';
                    document.getElementById('saCurrent').value = data.current_password;
                    document.getElementById('modalChange').style.display = 'flex';
                } else {
                    alert(data.detail || 'Credenciales inválidas');
                }
            } catch (e) {
                alert('Error de red');
            } finally {
                btn.disabled = false; btn.textContent = 'Verificar Identidad';
            }
        }

        async function changeAdminPass() {
            const user = document.getElementById('saUser').value.trim();
            const pass = document.getElementById('saPass').value.trim();
            const new1 = document.getElementById('saNew').value.trim();
            const new2 = document.getElementById('saNew2').value.trim();

            if (!new1 || new1 !== new2) {
                alert('Las claves no coinciden o están vacías.');
                return;
            }

            const btn = document.getElementById('btnSaChange');
            btn.disabled = true; btn.textContent = 'Guardando...';

            try {
                const res = await fetch('/api/superadmin/change', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user: user, password: pass, new_password: new1})
                });
                const data = await res.json();
                
                if (res.ok) {
                    alert('✅ Clave actualizada correctamente en el sistema.');
                    localStorage.setItem('centauroads_admin_key', new1); // Actualizar sesión local automática
                    closeModals();
                } else {
                    alert(data.detail || 'Error al cambiar clave');
                }
            } catch (e) {
                alert('Error de red');
            } finally {
                btn.disabled = false; btn.textContent = 'Actualizar Clave';
            }
        }
    </script>
</body>

</html>
