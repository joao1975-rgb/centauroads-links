    <style>
        body {
            margin: 0; padding: 0;
            background: #111116; color: #ffffff; font-family: 'Inter', sans-serif;
            display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden;
        }
        .loader-container { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .spinner {
            width: 45px; height: 45px; border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #FFB366; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px;
        }
        .text { font-size: 1rem; color: #aaa; letter-spacing: 1px; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="spinner"></div>
        <div class="text">Abriendo Destino...</div>
    </div>

        setTimeout(() => { window.location.replace(targetUrl); }, 400); 
    </script>
